name: Retrieval FTS canonical consistency

on:
  pull_request:
    paths:
      - 'src/retrieval_fts_consistency.c'
      - 'src/retrieval_fts_consistency.h'
      - 'src/retrieval_index.c'
      - 'src/retrieval_index.h'
      - 'src/retrieval_query.c'
      - 'src/retrieval_query.h'
      - 'tests/retrieval_query_test.c'
      - 'data/schemas/retrieval-index-v2.sql'
      - 'data/io.github.laurentiustaicu.ask_the_model.gresource.xml'
      - '.github/workflows/retrieval-fts-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libglib2.0-dev libjson-glib-dev libsqlite3-dev

      - name: Compile retrieval query tests with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail

          glib-compile-resources \
            data/io.github.laurentiustaicu.ask_the_model.gresource.xml \
            --sourcedir=data \
            --generate-source \
            --target=/tmp/atm-resources.c

          cc -std=c11 -Wall -Wextra -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc \
            src/repository_sources.c \
            src/markdown_sections.c \
            src/csv_table.c \
            src/structured_json.c \
            src/retrieval_index.c \
            src/retrieval_fts_consistency.c \
            src/retrieval_query.c \
            tests/retrieval_query_test.c \
            /tmp/atm-resources.c \
            $(pkg-config --cflags --libs glib-2.0 gio-2.0 json-glib-1.0 sqlite3) \
            -o /tmp/retrieval-query-test

          /tmp/retrieval-query-test
