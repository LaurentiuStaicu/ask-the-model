name: Presentation Interaction

on:
  pull_request:
    paths:
      - 'src/PresentationRenderer.vala'
      - 'src/PresentationNative.vapi'
      - 'src/Application.vala'
      - 'tests/presentation_renderer_test.vala'
      - 'tests/presentation_native_test.vala'
      - 'data/style.css'
      - 'scripts/validate_pres06_ui.py'
      - 'scripts/validate_pres07_sources.py'
      - 'scripts/validate_pres08_parity.py'
      - '.github/workflows/presentation-interaction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-interaction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK presentation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson \
            ninja-build \
            valac \
            xvfb \
            libgtk-4-dev \
            libgranite-7-dev \
            libsoup-3.0-dev \
            libjson-glib-dev \
            libsqlite3-dev \
            libarchive-dev \
            libyaml-dev

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          meson setup build

      - name: Build Presentation interaction qualification
        shell: bash
        run: |
          set -euo pipefail
          ninja -C build \
            presentation-native-test \
            presentation-renderer-test

      - name: Run Presentation renderer qualification
        shell: bash
        env:
          GTK_A11Y: none
          GTK_IM_MODULE: gtk-im-context-simple
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a ./build/presentation-renderer-test

      - name: Run Presentation native bridge qualification
        shell: bash
        run: |
          set -euo pipefail
          ./build/presentation-native-test

      - name: Validate PRES-06 interaction contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_pres06_ui.py

      - name: Validate PRES-07 Sources contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_pres07_sources.py

      - name: Validate PRES-08 live/History parity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_pres08_parity.py
