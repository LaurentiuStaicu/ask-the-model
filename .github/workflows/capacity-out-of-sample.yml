name: C0P-M5 out-of-sample capacity prediction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/capacity-v2/corpus.json'
      - 'benchmarks/capacity-v3/corpus.json'
      - 'src/archive_extract.c'
      - 'src/archive_extract.h'
      - 'src/capacity_measurement.c'
      - 'src/capacity_measurement.h'
      - 'src/cff_version.c'
      - 'src/cff_version.h'
      - 'src/repository_ingest.c'
      - 'src/repository_ingest.h'
      - 'src/repository_manifest.c'
      - 'src/repository_manifest.h'
      - 'src/repository_storage.c'
      - 'src/repository_storage.h'
      - 'src/snapshot_seal.c'
      - 'src/snapshot_seal.h'
      - 'src/snapshot_durability.c'
      - 'src/snapshot_durability.h'
      - 'src/repository_sources.c'
      - 'src/repository_sources.h'
      - 'src/markdown_sections.c'
      - 'src/markdown_sections.h'
      - 'src/csv_table.c'
      - 'src/csv_table.h'
      - 'src/structured_json.c'
      - 'src/structured_json.h'
      - 'src/retrieval_index.c'
      - 'src/retrieval_index.h'
      - 'data/schemas/retrieval-index-v2.sql'
      - 'data/io.github.laurentiustaicu.ask_the_model.gresource.xml'
      - 'tests/capacity_measurement_real_runner.c'
      - '.github/workflows/capacity-out-of-sample.yml'

permissions:
  contents: read

concurrency:
  group: capacity-c0p-m5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout AtM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install measurement dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            pkg-config \
            libarchive-dev \
            libglib2.0-dev \
            libglib2.0-bin \
            libjson-glib-dev \
            libsqlite3-dev \
            libyaml-dev

      - name: Compile real capacity measurement runner
        shell: bash
        run: |
          set -euo pipefail

          glib-compile-resources \
            data/io.github.laurentiustaicu.ask_the_model.gresource.xml \
            --sourcedir=data \
            --generate-source \
            --target=/tmp/atm-resources.c

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -Isrc \
            $(pkg-config --cflags \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0) \
            -c tests/capacity_measurement_real_runner.c \
            -o /tmp/capacity-measurement-real-runner.o

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Isrc \
            src/capacity_measurement.c \
            src/cff_version.c \
            src/archive_extract.c \
            src/repository_manifest.c \
            src/repository_storage.c \
            src/snapshot_seal.c \
            src/snapshot_durability.c \
            src/repository_ingest.c \
            src/repository_sources.c \
            src/markdown_sections.c \
            src/csv_table.c \
            src/structured_json.c \
            src/retrieval_index.c \
            /tmp/capacity-measurement-real-runner.o \
            /tmp/atm-resources.c \
            $(pkg-config --cflags --libs \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0 \
              sqlite3 \
              libarchive \
              yaml-0.1) \
            -o /tmp/atm-capacity-real-runner

      - name: Measure frozen training and holdout corpora
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          root=/tmp/atm-c0p-m5
          mkdir -p "$root/training" "$root/holdout"

          python3 - <<'PY' > "$root/corpus.tsv"
          import json
          import pathlib

          training = json.loads(
              pathlib.Path(
                  "benchmarks/capacity-v2/corpus.json"
              ).read_text(encoding="utf-8")
          )
          holdout = json.loads(
              pathlib.Path(
                  "benchmarks/capacity-v3/corpus.json"
              ).read_text(encoding="utf-8")
          )

          seen_training = set()
          seen_holdout = set()

          def emit(split, corpus, seen):
              for repository in corpus["repositories"]:
                  for sample in repository["samples"]:
                      key = (
                          repository["repository_id"],
                          sample["sha"],
                      )
                      if key in seen:
                          raise SystemExit(
                              f"duplicate {split} sample: {key}"
                          )
                      seen.add(key)
                      print(
                          split,
                          repository["repository_id"],
                          repository["repository"],
                          repository["acronym"],
                          repository["display_name"],
                          sample["label"],
                          sample["sha"],
                          sep="\t",
                      )

          emit("training", training, seen_training)
          emit("holdout", holdout, seen_holdout)

          if len(seen_training) != 18:
              raise SystemExit(
                  f"training set must contain 18 samples, got {len(seen_training)}"
              )
          if len(seen_holdout) != 12:
              raise SystemExit(
                  f"holdout set must contain 12 samples, got {len(seen_holdout)}"
              )
          overlap = seen_training & seen_holdout
          if overlap:
              raise SystemExit(
                  f"training/holdout overlap is forbidden: {sorted(overlap)}"
              )
          PY

          while IFS=$'\t' read -r \
            split repository_id repository acronym display_name label snapshot_sha
          do
            work="$root/work/$split/$repository_id/$label"
            archive_dir="$work/cache/repository-staging/$repository_id"
            archive="$archive_dir/$snapshot_sha.tar.gz"
            output="$root/$split/$repository_id-$label.json"

            mkdir -p "$archive_dir" "$work/data" "$work/state"

            curl \
              --fail \
              --location \
              --retry 3 \
              --silent \
              --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/LaurentiuStaicu/$repository/tarball/$snapshot_sha" \
              --output "$archive"

            test -s "$archive"

            /tmp/atm-capacity-real-runner \
              "$ATM_SOURCE_COMMIT" \
              "$repository_id" \
              "$acronym" \
              "$display_name" \
              "$snapshot_sha" \
              "$archive" \
              "$work" \
              "$output"

            python3 -m json.tool "$output" >/dev/null
          done < "$root/corpus.tsv"

      - name: Fit on M4 training only and evaluate M5 holdout
        shell: bash
        env:
          ATM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ATM_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import platform
          from fractions import Fraction

          root = pathlib.Path("/tmp/atm-c0p-m5")
          training_dir = root / "training"
          holdout_dir = root / "holdout"

          training_corpus = json.loads(
              pathlib.Path(
                  "benchmarks/capacity-v2/corpus.json"
              ).read_text(encoding="utf-8")
          )
          holdout_corpus = json.loads(
              pathlib.Path(
                  "benchmarks/capacity-v3/corpus.json"
              ).read_text(encoding="utf-8")
          )

          labels = {"training": {}, "holdout": {}}
          expected = {"training": set(), "holdout": set()}

          for split, corpus in (
              ("training", training_corpus),
              ("holdout", holdout_corpus),
          ):
              for repository in corpus["repositories"]:
                  rid = repository["repository_id"]
                  for sample in repository["samples"]:
                      key = (rid, sample["sha"])
                      labels[split][key] = sample["label"]
                      expected[split].add(key)

          def load_records(directory, split):
              records = []
              for path in sorted(directory.glob("*.json")):
                  record = json.loads(path.read_text(encoding="utf-8"))
                  key = (
                      record["repository_id"],
                      record["repository_sha"],
                  )
                  if key not in expected[split]:
                      raise SystemExit(
                          f"unexpected {split} record: {key}"
                      )
                  records.append(record)

              observed = {
                  (
                      record["repository_id"],
                      record["repository_sha"],
                  )
                  for record in records
              }
              if observed != expected[split]:
                  raise SystemExit(
                      f"{split} measured set does not match frozen corpus"
                  )
              return records

          training_records = load_records(
              training_dir,
              "training",
          )
          holdout_records = load_records(
              holdout_dir,
              "holdout",
          )

          def features(record, split):
              rid = record["repository_id"]
              sha = record["repository_sha"]
              logical = record["snapshot"]["logical_regular_bytes"]
              entries = record["snapshot"]["entries"]
              snapshot_peak = record["ingest_report"][
                  "fresh_data_root_additional_peak_bytes"
              ]
              index_peak = record["index_build"][
                  "cache_root_additional_peak_bytes"
              ]

              if logical <= 0 or entries <= 0:
                  raise SystemExit(
                      f"invalid observable feature for {rid} {sha}"
                  )

              overhead = max(
                  0,
                  snapshot_peak - logical,
              )

              return {
                  "repository_id": rid,
                  "label": labels[split][(rid, sha)],
                  "repository_sha": sha,
                  "logical_regular_bytes": logical,
                  "entries": entries,
                  "snapshot_additional_peak_bytes": snapshot_peak,
                  "index_additional_peak_bytes": index_peak,
                  "snapshot_overhead_per_entry":
                      Fraction(overhead, entries),
                  "snapshot_peak_to_logical":
                      Fraction(snapshot_peak, logical),
                  "index_peak_to_logical":
                      Fraction(index_peak, logical),
                  "index_peak_per_entry":
                      Fraction(index_peak, entries),
              }

          train_rows = [
              features(record, "training")
              for record in training_records
          ]
          holdout_rows = [
              features(record, "holdout")
              for record in holdout_records
          ]

          def ceil_fraction(value):
              return (
                  value.numerator +
                  value.denominator - 1
              ) // value.denominator

          fitted = {}
          evaluations = {}
          summary = {}

          for rid in ("ewd", "cbd", "rmd"):
              train = [
                  row
                  for row in train_rows
                  if row["repository_id"] == rid
              ]
              test = [
                  row
                  for row in holdout_rows
                  if row["repository_id"] == rid
              ]

              if len(train) != 6 or len(test) != 4:
                  raise SystemExit(
                      f"{rid}: expected 6 training and 4 holdout rows"
                  )

              snapshot_overhead_k = max(
                  row["snapshot_overhead_per_entry"]
                  for row in train
              )
              snapshot_ratio_k = max(
                  row["snapshot_peak_to_logical"]
                  for row in train
              )
              snapshot_absolute_floor = max(
                  row["snapshot_additional_peak_bytes"]
                  for row in train
              )
              index_ratio_k = max(
                  row["index_peak_to_logical"]
                  for row in train
              )
              index_entry_k = max(
                  row["index_peak_per_entry"]
                  for row in train
              )
              index_absolute_floor = max(
                  row["index_additional_peak_bytes"]
                  for row in train
              )

              fitted[rid] = {
                  "snapshot_overhead_per_entry": {
                      "numerator": snapshot_overhead_k.numerator,
                      "denominator": snapshot_overhead_k.denominator,
                  },
                  "snapshot_peak_to_logical": {
                      "numerator": snapshot_ratio_k.numerator,
                      "denominator": snapshot_ratio_k.denominator,
                  },
                  "snapshot_absolute_floor_bytes":
                      snapshot_absolute_floor,
                  "index_peak_to_logical": {
                      "numerator": index_ratio_k.numerator,
                      "denominator": index_ratio_k.denominator,
                  },
                  "index_peak_per_entry": {
                      "numerator": index_entry_k.numerator,
                      "denominator": index_entry_k.denominator,
                  },
                  "index_absolute_floor_bytes":
                      index_absolute_floor,
              }

              cases = []
              for row in test:
                  snapshot_additive = (
                      row["logical_regular_bytes"] +
                      ceil_fraction(
                          snapshot_overhead_k *
                          row["entries"]
                      )
                  )
                  snapshot_ratio = ceil_fraction(
                      snapshot_ratio_k *
                      row["logical_regular_bytes"]
                  )
                  snapshot_prediction = max(
                      snapshot_additive,
                      snapshot_ratio,
                      snapshot_absolute_floor,
                  )

                  index_ratio = ceil_fraction(
                      index_ratio_k *
                      row["logical_regular_bytes"]
                  )
                  index_entry = ceil_fraction(
                      index_entry_k *
                      row["entries"]
                  )
                  index_prediction = max(
                      index_ratio,
                      index_entry,
                      index_absolute_floor,
                  )

                  actual_snapshot = row[
                      "snapshot_additional_peak_bytes"
                  ]
                  actual_index = row[
                      "index_additional_peak_bytes"
                  ]

                  cases.append(
                      {
                          "label": row["label"],
                          "repository_sha": row["repository_sha"],
                          "features": {
                              "logical_regular_bytes":
                                  row["logical_regular_bytes"],
                              "entries": row["entries"],
                          },
                          "snapshot_hybrid": {
                              "predicted_bytes": snapshot_prediction,
                              "actual_bytes": actual_snapshot,
                              "covered":
                                  snapshot_prediction >=
                                  actual_snapshot,
                              "actual_over_prediction":
                                  actual_snapshot /
                                  max(snapshot_prediction, 1),
                              "components": {
                                  "additive_per_entry":
                                      snapshot_additive,
                                  "ratio_logical":
                                      snapshot_ratio,
                                  "historical_absolute_floor":
                                      snapshot_absolute_floor,
                              },
                          },
                          "index_hybrid": {
                              "predicted_bytes": index_prediction,
                              "actual_bytes": actual_index,
                              "covered":
                                  index_prediction >=
                                  actual_index,
                              "actual_over_prediction":
                                  actual_index /
                                  max(index_prediction, 1),
                              "components": {
                                  "ratio_logical":
                                      index_ratio,
                                  "per_entry":
                                      index_entry,
                                  "historical_absolute_floor":
                                      index_absolute_floor,
                              },
                          },
                      }
                  )

              evaluations[rid] = cases

              snapshot_ratios = [
                  case["snapshot_hybrid"][
                      "actual_over_prediction"
                  ]
                  for case in cases
              ]
              index_ratios = [
                  case["index_hybrid"][
                      "actual_over_prediction"
                  ]
                  for case in cases
              ]

              summary[rid] = {
                  "snapshot": {
                      "covered_count": sum(
                          1
                          for case in cases
                          if case["snapshot_hybrid"]["covered"]
                      ),
                      "case_count": len(cases),
                      "worst_actual_over_prediction":
                          max(snapshot_ratios),
                      "minimum_observed_multiplicative_margin":
                          max(0.0, max(snapshot_ratios) - 1.0),
                  },
                  "index": {
                      "covered_count": sum(
                          1
                          for case in cases
                          if case["index_hybrid"]["covered"]
                      ),
                      "case_count": len(cases),
                      "worst_actual_over_prediction":
                          max(index_ratios),
                      "minimum_observed_multiplicative_margin":
                          max(0.0, max(index_ratios) - 1.0),
                  },
              }

          all_snapshot = [
              case["snapshot_hybrid"]
              for cases in evaluations.values()
              for case in cases
          ]
          all_index = [
              case["index_hybrid"]
              for cases in evaluations.values()
              for case in cases
          ]

          artifact = {
              "schema_version": 1,
              "measurement_id":
                  "atm-c0p-m5-out-of-sample-capacity-v1",
              "production_prediction_selected": False,
              "production_margin_selected": False,
              "training_refit_on_holdout": False,
              "atm_source_commit":
                  os.environ["ATM_SOURCE_COMMIT"],
              "workflow_commit":
                  os.environ["ATM_WORKFLOW_COMMIT"],
              "runtime": {
                  "system": platform.system(),
                  "release": platform.release(),
                  "machine": platform.machine(),
              },
              "training_corpus": training_corpus,
              "holdout_corpus": holdout_corpus,
              "fitted_on_training_only": fitted,
              "holdout_evaluations": evaluations,
              "summary": summary,
              "global_summary": {
                  "snapshot_covered_count": sum(
                      1
                      for value in all_snapshot
                      if value["covered"]
                  ),
                  "snapshot_case_count": len(all_snapshot),
                  "index_covered_count": sum(
                      1
                      for value in all_index
                      if value["covered"]
                  ),
                  "index_case_count": len(all_index),
                  "snapshot_worst_actual_over_prediction":
                      max(
                          value["actual_over_prediction"]
                          for value in all_snapshot
                      ),
                  "index_worst_actual_over_prediction":
                      max(
                          value["actual_over_prediction"]
                          for value in all_index
                      ),
              },
              "interpretation": [
                  "Training is exactly the 18-SHA C0-M4 corpus; holdout SHAs are never used to fit or refit coefficients.",
                  "Coverage failure is recorded as evidence and is not hidden by automatically adding a margin.",
                  "Observed out-of-sample coverage does not by itself prove an upper bound for arbitrary future SHAs.",
                  "No production predictor or margin is selected by this measurement.",
              ],
          }

          output = (
              root /
              "c0p-m5-out-of-sample-capacity.json"
          )
          output.write_text(
              json.dumps(
                  artifact,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )

          print(
              json.dumps(
                  {
                      "summary": summary,
                      "global_summary":
                          artifact["global_summary"],
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Upload C0P-M5 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atm-c0p-m5-out-of-sample-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/atm-c0p-m5/training/*.json
            /tmp/atm-c0p-m5/holdout/*.json
            /tmp/atm-c0p-m5/c0p-m5-out-of-sample-capacity.json
          if-no-files-found: error
          retention-days: 90
