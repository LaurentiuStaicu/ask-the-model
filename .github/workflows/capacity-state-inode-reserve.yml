name: C0P-M7 state inode reserve measurement

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/control_state.c'
      - 'src/control_state.h'
      - 'data/io.github.laurentiustaicu.ask_the_model.gresource.xml'
      - 'data/schemas/control-state-v1.sql'
      - 'data/schemas/control-state-v2.sql'
      - 'tests/capacity_state_inode_reserve_runner.c'
      - '.github/workflows/capacity-state-inode-reserve.yml'

permissions:
  contents: read

concurrency:
  group: capacity-c0p-m7-inodes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout AtM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install measurement dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libglib2.0-bin \
            libjson-glib-dev \
            libsqlite3-dev

      - name: Compile state inode reserve runner
        shell: bash
        run: |
          set -euo pipefail

          glib-compile-resources \
            data/io.github.laurentiustaicu.ask_the_model.gresource.xml \
            --sourcedir=data \
            --generate-source \
            --target=/tmp/atm-resources.c

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -Isrc \
            $(pkg-config --cflags \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0 \
              sqlite3) \
            -c tests/capacity_state_inode_reserve_runner.c \
            -o /tmp/capacity-state-inode-reserve-runner.o

          cc \
            -std=c11 \
            -O2 \
            -Wall \
            -Wextra \
            -Isrc \
            src/control_state.c \
            /tmp/capacity-state-inode-reserve-runner.o \
            /tmp/atm-resources.c \
            $(pkg-config --cflags --libs \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0 \
              sqlite3) \
            -o /tmp/atm-capacity-state-inode-reserve-runner

      - name: Measure cold-sidecar inode headroom
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail

          root=/tmp/atm-c0p-m7
          results="$root/results"
          mkdir -p "$results"

          for leave in 1 2 3 4 8; do
            case_root="$root/case-$leave"
            state="$case_root/state"
            mkdir -p "$state"

            sudo mount -t tmpfs \
              -o size=16M,nr_inodes=128 \
              tmpfs "$state"
            trap 'sudo umount "$state" || true' EXIT

            /tmp/atm-capacity-state-inode-reserve-runner \
              --exercise \
              "$state" \
              "$leave" \
              | tee "$results/leave-$leave.json"

            sudo umount "$state"
            trap - EXIT
          done

      - name: Aggregate inode reserve evidence
        shell: bash
        env:
          ATM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ATM_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import platform

          results = pathlib.Path("/tmp/atm-c0p-m7/results")
          records = []

          for path in sorted(results.glob("leave-*.json")):
              record = json.loads(path.read_text(encoding="utf-8"))
              if not record["invariant_ok"]:
                  raise SystemExit(f"inode invariant failed: {record}")
              if record["available_bytes_before_operation"] < 8 * 1024 * 1024:
                  raise SystemExit(
                      "byte budget unexpectedly low in inode-only measurement"
                  )
              records.append(record)

          if {record["leave_inodes"] for record in records} != {1, 2, 3, 4, 8}:
              raise SystemExit("inode matrix is incomplete")

          artifact = {
              "schema_version": 1,
              "measurement_id": "atm-c0p-m7-state-inode-reserve-v1",
              "atm_source_commit": os.environ["ATM_SOURCE_COMMIT"],
              "workflow_commit": os.environ["ATM_WORKFLOW_COMMIT"],
              "runtime": {
                  "system": platform.system(),
                  "release": platform.release(),
                  "machine": platform.machine(),
              },
              "records": sorted(
                  records,
                  key=lambda item: item["leave_inodes"],
              ),
          }

          output = results / "c0p-m7-state-inode-reserve.json"
          output.write_text(
              json.dumps(artifact, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(
              json.dumps(
                  {
                      str(record["leave_inodes"]): {
                          "classification": record["classification"],
                          "available_bytes": record[
                              "available_bytes_before_operation"
                          ],
                          "error": (
                              record["operation_error"]["message"]
                              if record["operation_error"] is not None
                              else None
                          ),
                      }
                      for record in artifact["records"]
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Upload C0P-M7 inode evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atm-c0p-m7-state-inodes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/atm-c0p-m7/results/*.json
          if-no-files-found: error
          retention-days: 90
