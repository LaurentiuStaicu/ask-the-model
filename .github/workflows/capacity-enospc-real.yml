name: C0-E1 genuine ENOSPC qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/retrieval-v1/benchmark.json'
      - 'src/archive_extract.c'
      - 'src/archive_extract.h'
      - 'src/cff_version.c'
      - 'src/cff_version.h'
      - 'src/control_state.c'
      - 'src/control_state.h'
      - 'src/repository_ingest.c'
      - 'src/repository_ingest.h'
      - 'src/repository_manifest.c'
      - 'src/repository_manifest.h'
      - 'src/repository_sources.c'
      - 'src/repository_sources.h'
      - 'src/repository_storage.c'
      - 'src/repository_storage.h'
      - 'src/snapshot_seal.c'
      - 'src/snapshot_seal.h'
      - 'src/snapshot_durability.c'
      - 'src/snapshot_durability.h'
      - 'src/retrieval_index.c'
      - 'src/retrieval_index.h'
      - 'src/markdown_sections.c'
      - 'src/markdown_sections.h'
      - 'src/csv_table.c'
      - 'src/csv_table.h'
      - 'src/structured_json.c'
      - 'src/structured_json.h'
      - 'data/io.github.laurentiustaicu.ask_the_model.gresource.xml'
      - 'data/schemas/**'
      - 'tests/capacity_enospc_runner.c'
      - '.github/workflows/capacity-enospc-real.yml'

permissions:
  contents: read

concurrency:
  group: capacity-c0-e1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  genuine-enospc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout AtM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install qualification build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            pkg-config \
            libarchive-dev \
            libglib2.0-dev \
            libglib2.0-bin \
            libjson-glib-dev \
            libsqlite3-dev \
            libyaml-dev

      - name: Compile ENOSPC qualification runner
        shell: bash
        run: |
          set -euo pipefail

          glib-compile-resources \
            data/io.github.laurentiustaicu.ask_the_model.gresource.xml \
            --sourcedir=data \
            --generate-source \
            --target=/tmp/atm-resources.c

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -Isrc \
            $(pkg-config --cflags \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0) \
            -c tests/capacity_enospc_runner.c \
            -o /tmp/capacity-enospc-runner.o

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Isrc \
            src/cff_version.c \
            src/archive_extract.c \
            src/repository_manifest.c \
            src/repository_storage.c \
            src/snapshot_seal.c \
            src/snapshot_durability.c \
            src/repository_ingest.c \
            src/repository_sources.c \
            src/markdown_sections.c \
            src/csv_table.c \
            src/structured_json.c \
            src/retrieval_index.c \
            src/control_state.c \
            /tmp/capacity-enospc-runner.o \
            /tmp/atm-resources.c \
            $(pkg-config --cflags --libs \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0 \
              sqlite3 \
              libarchive \
              yaml-0.1) \
            -o /tmp/atm-capacity-enospc-runner

      - name: Resolve pinned repository SHAs
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_ENV"
          import json

          with open(
              "benchmarks/retrieval-v1/benchmark.json",
              encoding="utf-8",
          ) as handle:
              benchmark = json.load(handle)

          corpus = {
              item["repository_id"]: item["snapshot_sha"]
              for item in benchmark["corpus"]
          }

          print(f"ATM_EWD_SHA={corpus['ewd']}")
          print(f"ATM_RMD_SHA={corpus['rmd']}")
          PY

      - name: Download exact pinned archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/atm-c0-e1/archives

          for item in \
            "ewd empirical-world3-dynamics $ATM_EWD_SHA" \
            "rmd romanian-monetary-dynamics $ATM_RMD_SHA"
          do
            read -r id repository sha <<<"$item"

            curl \
              --fail \
              --location \
              --retry 3 \
              --silent \
              --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/LaurentiuStaicu/$repository/tarball/$sha" \
              --output "/tmp/atm-c0-e1/archives/$id.tar.gz"

            test -s "/tmp/atm-c0-e1/archives/$id.tar.gz"
          done

      - name: Qualify data-root ENOSPC with RMD
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail

          root=/tmp/atm-c0-e1/data-case
          data="$root/data"
          state="$root/state"
          mkdir -p "$data" "$state" /tmp/atm-c0-e1/results

          sudo mount -t tmpfs -o size=8M tmpfs "$data"
          trap 'sudo umount "$data" || true' EXIT

          old_sha=1111111111111111111111111111111111111111

          /tmp/atm-capacity-enospc-runner \
            --data-enospc \
            "$data" \
            "$state" \
            /tmp/atm-c0-e1/archives/rmd.tar.gz \
            rmd \
            RMD \
            "Romanian Monetary Dynamics" \
            "$ATM_RMD_SHA" \
            "$old_sha" \
            | tee /tmp/atm-c0-e1/results/data-enospc-attempt.json

          /tmp/atm-capacity-enospc-runner \
            --verify-data \
            "$data" \
            "$state" \
            rmd \
            "$ATM_RMD_SHA" \
            "$old_sha" \
            | tee /tmp/atm-c0-e1/results/data-enospc-restart.json

          python3 - <<'PY'
          import json

          for name in (
              "data-enospc-attempt.json",
              "data-enospc-restart.json",
          ):
              with open(
                  f"/tmp/atm-c0-e1/results/{name}",
                  encoding="utf-8",
              ) as handle:
                  record = json.load(handle)
              if not record["qualified"]:
                  raise SystemExit(f"{name} is not qualified: {record}")

          print("PASS: genuine data-root ENOSPC preserved old authority and cleaned staging.")
          PY

          sudo umount "$data"
          trap - EXIT

      - name: Qualify cache-root index ENOSPC with EWD
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail

          root=/tmp/atm-c0-e1/index-case
          data="$root/data"
          cache="$root/cache"
          state="$root/state"
          mkdir -p "$data" "$cache" "$state"

          sudo mount -t tmpfs -o size=8M tmpfs "$cache"
          trap 'sudo umount "$cache" || true' EXIT

          cp /tmp/atm-c0-e1/archives/ewd.tar.gz "$cache/ewd.tar.gz"
          old_sha=2222222222222222222222222222222222222222

          /tmp/atm-capacity-enospc-runner \
            --index-enospc \
            "$data" \
            "$cache" \
            "$state" \
            "$cache/ewd.tar.gz" \
            ewd \
            EWD \
            "Empirical World3 Dynamics" \
            "$ATM_EWD_SHA" \
            "$old_sha" \
            | tee /tmp/atm-c0-e1/results/index-enospc-attempt.json

          /tmp/atm-capacity-enospc-runner \
            --verify-index \
            "$data" \
            "$cache" \
            "$state" \
            ewd \
            "$ATM_EWD_SHA" \
            "$old_sha" \
            | tee /tmp/atm-c0-e1/results/index-enospc-restart.json

          python3 - <<'PY'
          import json

          for name in (
              "index-enospc-attempt.json",
              "index-enospc-restart.json",
          ):
              with open(
                  f"/tmp/atm-c0-e1/results/{name}",
                  encoding="utf-8",
              ) as handle:
                  record = json.load(handle)
              if not record["qualified"]:
                  raise SystemExit(f"{name} is not qualified: {record}")

          print("PASS: genuine index ENOSPC preserved old authority and left only recoverable unreferenced snapshot state.")
          PY

          sudo umount "$cache"
          trap - EXIT

      - name: Aggregate C0-E1 qualification evidence
        shell: bash
        env:
          ATM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ATM_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import platform

          results = pathlib.Path("/tmp/atm-c0-e1/results")
          records = []

          for path in sorted(results.glob("*.json")):
              with path.open(encoding="utf-8") as handle:
                  records.append(json.load(handle))

          artifact = {
              "schema_version": 1,
              "qualification_id": "atm-c0-e1-genuine-enospc-v1",
              "atm_source_commit": os.environ["ATM_SOURCE_COMMIT"],
              "workflow_commit": os.environ["ATM_WORKFLOW_COMMIT"],
              "runtime": {
                  "system": platform.system(),
                  "release": platform.release(),
                  "machine": platform.machine(),
              },
              "records": records,
          }

          output = results / "c0-e1-genuine-enospc.json"
          output.write_text(
              json.dumps(
                  artifact,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          print(output.read_text(encoding="utf-8"))
          PY

      - name: Upload C0-E1 qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atm-c0-e1-enospc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/atm-c0-e1/results/*.json
          if-no-files-found: error
          retention-days: 90
