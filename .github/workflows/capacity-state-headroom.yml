name: C0-M2 state headroom scaling measurement

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/control_state.c'
      - 'src/control_state.h'
      - 'data/io.github.laurentiustaicu.ask_the_model.gresource.xml'
      - 'data/schemas/control-state-v1.sql'
      - 'data/schemas/control-state-v2.sql'
      - 'tests/capacity_state_headroom_runner.c'
      - '.github/workflows/capacity-state-headroom.yml'

permissions:
  contents: read

concurrency:
  group: capacity-c0-m2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure-state-headroom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout AtM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install measurement build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libglib2.0-bin \
            libjson-glib-dev \
            libsqlite3-dev

      - name: Compile state headroom measurement runner
        shell: bash
        run: |
          set -euo pipefail

          glib-compile-resources \
            data/io.github.laurentiustaicu.ask_the_model.gresource.xml \
            --sourcedir=data \
            --generate-source \
            --target=/tmp/atm-resources.c

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -Isrc \
            $(pkg-config --cflags \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0 \
              sqlite3) \
            -c tests/capacity_state_headroom_runner.c \
            -o /tmp/capacity-state-headroom-runner.o

          cc \
            -std=c11 \
            -O2 \
            -Wall \
            -Wextra \
            -Isrc \
            src/control_state.c \
            /tmp/capacity-state-headroom-runner.o \
            /tmp/atm-resources.c \
            $(pkg-config --cflags --libs \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0 \
              sqlite3) \
            -o /tmp/atm-capacity-state-headroom-runner

      - name: Measure headroom across Control DB history sizes
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail

          root=/tmp/atm-c0-m2
          results="$root/results"
          mkdir -p "$results"

          mounted=""
          cleanup() {
            if [ -n "$mounted" ]; then
              sudo umount "$mounted" || true
            fi
          }
          trap cleanup EXIT

          for history in 1 100 1000; do
            for leave in 32768 65536 131072 262144; do
              case_root="$root/h${history}-b${leave}"
              state="$case_root/state"
              output="$results/h${history}-b${leave}.json"

              rm -rf "$case_root"
              mkdir -p "$state"

              sudo mount \
                -t tmpfs \
                -o size=16M,nr_inodes=4096 \
                tmpfs \
                "$state"
              mounted="$state"

              /tmp/atm-capacity-state-headroom-runner \
                --exercise \
                "$state" \
                rmd \
                "$history" \
                "$leave" \
                | tee "$output"

              python3 -m json.tool "$output" >/dev/null

              sudo umount "$state"
              mounted=""
            done
          done

          trap - EXIT

      - name: Aggregate C0-M2 evidence
        shell: bash
        env:
          ATM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ATM_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import collections
          import json
          import os
          import pathlib
          import platform

          results = pathlib.Path("/tmp/atm-c0-m2/results")
          records = []

          for path in sorted(results.glob("h*-b*.json")):
              records.append(
                  json.loads(path.read_text(encoding="utf-8"))
              )

          expected = {
              (history, leave)
              for history in (1, 100, 1000)
              for leave in (32768, 65536, 131072, 262144)
          }
          actual = {
              (
                  record["history_generations"],
                  record["leave_target_bytes"],
              )
              for record in records
          }

          if actual != expected:
              raise SystemExit(
                  f"C0-M2 matrix mismatch: expected={sorted(expected)} "
                  f"actual={sorted(actual)}"
              )

          bad_integrity = [
              record
              for record in records
              if not record["integrity_qualified"]
          ]
          if bad_integrity:
              raise SystemExit(
                  f"C0-M2 found authority-integrity failures: {bad_integrity}"
              )

          outcomes = collections.Counter(
              record["outcome"]
              for record in records
          )

          if outcomes["SUCCESS"] == 0:
              raise SystemExit(
                  "C0-M2 matrix produced no successful guarded mutation"
              )

          if sum(
              count
              for outcome, count in outcomes.items()
              if outcome != "SUCCESS"
          ) == 0:
              raise SystemExit(
                  "C0-M2 matrix produced no low-headroom failure boundary"
              )

          artifact = {
              "schema_version": 1,
              "measurement_id": "atm-c0-m2-state-headroom-v1",
              "production_reserve_selected": False,
              "atm_source_commit": os.environ["ATM_SOURCE_COMMIT"],
              "workflow_commit": os.environ["ATM_WORKFLOW_COMMIT"],
              "runtime": {
                  "system": platform.system(),
                  "release": platform.release(),
                  "machine": platform.machine(),
              },
              "matrix": {
                  "history_generations": [1, 100, 1000],
                  "leave_target_bytes": [
                      32768,
                      65536,
                      131072,
                      262144,
                  ],
              },
              "outcome_counts": dict(sorted(outcomes.items())),
              "records": records,
          }

          output = results / "c0-m2-state-headroom.json"
          output.write_text(
              json.dumps(
                  artifact,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )

          print(output.read_text(encoding="utf-8"))
          PY

      - name: Upload C0-M2 measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atm-c0-m2-state-headroom-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/atm-c0-m2/results/*.json
          if-no-files-found: error
          retention-days: 90
