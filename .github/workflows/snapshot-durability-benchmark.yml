name: A1-M1 snapshot durability barrier benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/retrieval-v1/benchmark.json'
      - 'src/archive_extract.c'
      - 'src/archive_extract.h'
      - 'src/repository_manifest.c'
      - 'src/repository_manifest.h'
      - 'src/cff_version.c'
      - 'src/cff_version.h'
      - 'src/snapshot_seal.c'
      - 'src/snapshot_seal.h'
      - 'src/snapshot_durability.c'
      - 'src/snapshot_durability.h'
      - 'tests/snapshot_durability_benchmark.c'
      - '.github/workflows/snapshot-durability-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: durability-a1-m1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout AtM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            pkg-config \
            libarchive-dev \
            libglib2.0-dev \
            libjson-glib-dev \
            libyaml-dev

      - name: Compile durability benchmark runner
        shell: bash
        run: |
          set -euo pipefail

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -Isrc \
            $(pkg-config --cflags \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0) \
            -c tests/snapshot_durability_benchmark.c \
            -o /tmp/snapshot-durability-benchmark.o

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Isrc \
            src/archive_extract.c \
            src/repository_manifest.c \
            src/cff_version.c \
            src/snapshot_seal.c \
            src/snapshot_durability.c \
            /tmp/snapshot-durability-benchmark.o \
            $(pkg-config --cflags --libs \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0 \
              libarchive \
              yaml-0.1) \
            -o /tmp/atm-a1-durability-benchmark

      - name: Record runner filesystem context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atm-a1-m1/results
          {
            echo "uname:"
            uname -a
            echo
            echo "findmnt /tmp:"
            findmnt -T /tmp -o TARGET,SOURCE,FSTYPE,OPTIONS
            echo
            echo "df /tmp:"
            df -Th /tmp
          } | tee /tmp/atm-a1-m1/results/runner-filesystem.txt

      - name: Benchmark pinned EWD CBD RMD snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY' >/tmp/atm-a1-m1-corpus.tsv
          import json

          with open(
              "benchmarks/retrieval-v1/benchmark.json",
              encoding="utf-8",
          ) as handle:
              benchmark = json.load(handle)

          for item in benchmark["corpus"]:
              print(
                  item["repository_id"],
                  item["snapshot_sha"],
                  sep="\t",
              )
          PY

          while IFS=$'\t' read -r repository_id snapshot_sha; do
            case "$repository_id" in
              ewd)
                repository="empirical-world3-dynamics"
                acronym="EWD"
                display_name="Empirical World3 Dynamics"
                ;;
              cbd)
                repository="cognitive-belief-dynamics"
                acronym="CBD"
                display_name="Cognitive Belief Dynamics"
                ;;
              rmd)
                repository="romanian-monetary-dynamics"
                acronym="RMD"
                display_name="Romanian Monetary Dynamics"
                ;;
              *)
                printf 'Unsupported A1-M1 repository: %s\n' "$repository_id" >&2
                exit 1
                ;;
            esac

            work="/tmp/atm-a1-m1/$repository_id"
            archive_dir="$work/archive"
            archive="$archive_dir/$snapshot_sha.tar.gz"
            output="/tmp/atm-a1-m1/results/$repository_id.json"

            mkdir -p "$archive_dir" "$work/benchmark"

            curl \
              --fail \
              --location \
              --retry 3 \
              --silent \
              --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/LaurentiuStaicu/$repository/tarball/$snapshot_sha" \
              --output "$archive"

            test -s "$archive"

            /tmp/atm-a1-durability-benchmark \
              "$ATM_SOURCE_COMMIT" \
              "$repository_id" \
              "$acronym" \
              "$display_name" \
              "$snapshot_sha" \
              "$archive" \
              "$work/benchmark" \
              "$output"

            python3 -m json.tool "$output" >/dev/null
          done </tmp/atm-a1-m1-corpus.tsv

      - name: Aggregate benchmark artifact
        shell: bash
        env:
          ATM_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import statistics

          results_dir = pathlib.Path("/tmp/atm-a1-m1/results")
          records = []

          for path in sorted(results_dir.glob("*.json")):
              with path.open(encoding="utf-8") as handle:
                  records.append(json.load(handle))

          if {record["repository_id"] for record in records} != {
              "ewd", "cbd", "rmd"
          }:
              raise SystemExit(
                  "A1-M1 result set does not contain exactly EWD/CBD/RMD"
              )

          summary = {}

          for record in records:
              repo = record["repository_id"]
              summary[repo] = {}

              grouped = {}
              for run in record["runs"]:
                  grouped.setdefault(run["strategy"], []).append(run)

              if set(grouped) != {
                  "S3_CONTROL",
                  "S1_TARGETED_FSYNC",
                  "S2_SYNCFS",
              }:
                  raise SystemExit(
                      f"{repo}: incomplete strategy set"
                  )

              for strategy, runs in grouped.items():
                  if len(runs) != 3:
                      raise SystemExit(
                          f"{repo} {strategy}: expected 3 runs"
                      )

                  summary[repo][strategy] = {
                      "median_extraction_elapsed_us": int(
                          statistics.median(
                              r["extraction_elapsed_us"]
                              for r in runs
                          )
                      ),
                      "median_validation_elapsed_us": int(
                          statistics.median(
                              r["validation_elapsed_us"]
                              for r in runs
                          )
                      ),
                      "median_seal_elapsed_us": int(
                          statistics.median(
                              r["seal_elapsed_us"]
                              for r in runs
                          )
                      ),
                      "median_barrier_elapsed_us": int(
                          statistics.median(
                              r["barrier_elapsed_us"]
                              for r in runs
                          )
                      ),
                      "median_prepared_elapsed_us": int(
                          statistics.median(
                              r["prepared_elapsed_us"]
                              for r in runs
                          )
                      ),
                      "file_fsync_calls": runs[0][
                          "file_fsync_calls"
                      ],
                      "directory_fsync_calls": runs[0][
                          "directory_fsync_calls"
                      ],
                      "syncfs_calls": runs[0]["syncfs_calls"],
                      "seal_file_count": runs[0][
                          "seal_file_count"
                      ],
                      "seal_total_bytes": runs[0][
                          "seal_total_bytes"
                      ],
                  }

              control = summary[repo]["S3_CONTROL"][
                  "median_prepared_elapsed_us"
              ]
              for candidate in (
                  "S1_TARGETED_FSYNC",
                  "S2_SYNCFS",
              ):
                  candidate_total = summary[repo][candidate][
                      "median_prepared_elapsed_us"
                  ]
                  summary[repo][candidate][
                      "median_total_over_control_us"
                  ] = candidate_total - control

          artifact = {
              "schema_version": 1,
              "measurement_id": "atm-a1-m1-durability-barrier-v1",
              "status": "measurement-only",
              "production_barrier_selected": False,
              "atm_source_commit": records[0][
                  "atm_source_commit"
              ],
              "workflow_commit": os.environ.get(
                  "ATM_WORKFLOW_COMMIT"
              ),
              "method": {
                  "strategies": [
                      "S3_CONTROL",
                      "S1_TARGETED_FSYNC",
                      "S2_SYNCFS",
                  ],
                  "runs_per_strategy_per_repository": 3,
                  "order_rotated": True,
                  "S1": (
                      "fsync every regular file, then fsync each "
                      "directory bottom-up including snapshot root"
                  ),
                  "S2": (
                      "one syncfs call on an fd for the snapshot "
                      "filesystem"
                  ),
                  "scope": (
                      "fresh extraction + manifest validation + "
                      "snapshot seal + candidate barrier; no rename, "
                      "Control DB activation, or production wiring"
                  ),
              },
              "records": records,
              "summary": summary,
              "limitations": [
                  (
                      "GitHub-hosted timing is comparative qualification "
                      "evidence, not a desktop latency guarantee."
                  ),
                  (
                      "This process-level benchmark does not prove "
                      "physical power-loss durability."
                  ),
                  (
                      "S1/S2 promotion still requires Tier-2 durability "
                      "evidence and a separate production-policy decision."
                  ),
              ],
          }

          output = (
              results_dir /
              "a1-m1-durability-barrier-benchmark.json"
          )
          output.write_text(
              json.dumps(
                  artifact,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )

          print(output.read_text(encoding="utf-8"))
          PY

      - name: Upload A1-M1 benchmark
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atm-a1-m1-durability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/atm-a1-m1/results/*
          if-no-files-found: error
          retention-days: 90
