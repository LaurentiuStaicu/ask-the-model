name: Flatpak

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/elementary/flatpak-platform/runtime:8
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore development repository history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if git fetch origin flatpak-repo:refs/remotes/origin/flatpak-repo 2>/dev/null; then
            git archive origin/flatpak-repo repo | tar -x
          fi

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: AskTheModel.flatpak
          artifact-name: AskTheModel-x86_64.flatpak
          manifest-path: io.github.laurentiustaicu.ask_the_model.yml
          repository-name: appcenter
          repository-url: https://flatpak.elementary.io/repo.flatpakrepo
          repo-dir: repo
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Publish versioned GitHub release and bundle when needed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const meson = fs.readFileSync('meson.build', 'utf8');
            const match = meson.match(/version:\s*'([^']+)'/);
            if (!match) {
              core.setFailed('Could not read the project version from meson.build');
              return;
            }

            const version = match[1];
            const tag = `v${version}`;
            const releasePath = `releases/${tag}.md`;
            const assetPath = 'AskTheModel.flatpak';
            const assetName = 'AskTheModel.flatpak';

            if (!fs.existsSync(releasePath)) {
              core.info(`No release notes found at ${releasePath}; skipping GitHub Release publication.`);
              return;
            }

            if (!fs.existsSync(assetPath)) {
              core.setFailed(`Expected release bundle ${assetPath} was not produced.`);
              return;
            }

            let release;
            let created = false;

            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              release = response.data;
              core.info(`GitHub Release ${tag} already exists.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              const body = fs.readFileSync(releasePath, 'utf8');
              const subtitleMatch = body.match(/\*\*([^*]+)\*\*/);
              let subtitle = subtitleMatch ? subtitleMatch[1].trim() : 'Release';
              subtitle = subtitle.replace(/\s+—\s+\d{4}-\d{2}-\d{2}$/, '');

              const response = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `${tag} — ${subtitle}`,
                body,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              });

              release = response.data;
              created = true;
              core.info(`Published GitHub Release ${tag}.`);
            }

            const existingAsset = release.assets.find((asset) => asset.name === assetName);
            if (existingAsset) {
              core.info(`Release asset ${assetName} already exists; leaving it unchanged.`);
              return;
            }

            if (!created) {
              const tagRef = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });

              if (tagRef.data.object.type !== 'commit' || tagRef.data.object.sha !== context.sha) {
                core.warning(
                  `Release ${tag} has no ${assetName}, but its tag does not point to this workflow commit. ` +
                  'Refusing to attach a bundle built from a different commit.'
                );
                return;
              }
            }

            const data = fs.readFileSync(assetPath);

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: assetName,
              data,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': data.length,
              },
            });

            core.info(`Uploaded ${assetName} to GitHub Release ${tag}.`);

      - name: Finalize AtM development repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p repo/refs/remotes

          flatpak build-update-repo repo \
            --generate-static-deltas \
            --title="AtM Development" \
            --comment="Development updates for Ask the Model" \
            --description="Automatically published development builds of Ask the Model from the main branch." \
            --homepage="https://github.com/LaurentiuStaicu/ask-the-model" \
            --icon="https://raw.githubusercontent.com/LaurentiuStaicu/ask-the-model/main/data/icons/64.png" \
            --default-branch=master

      - name: Publish AtM development repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_DIR="$(mktemp -d)"
          cp -a repo "$PUBLISH_DIR/repo"

          cat > "$PUBLISH_DIR/atm-development.flatpakrepo" <<'EOF'
          [Flatpak Repo]
          Title=AtM Development
          Url=https://raw.githubusercontent.com/LaurentiuStaicu/ask-the-model/flatpak-repo/repo/
          Homepage=https://github.com/LaurentiuStaicu/ask-the-model
          Comment=Development updates for Ask the Model
          Description=Automatically published development builds of Ask the Model.
          Icon=https://raw.githubusercontent.com/LaurentiuStaicu/ask-the-model/main/data/icons/64.png
          EOF

          cat > "$PUBLISH_DIR/README.md" <<'EOF'
          # Ask the Model — development Flatpak repository

          This branch is generated automatically from `main`.

          Application name: **Ask the Model**

          Application ID: `io.github.laurentiustaicu.ask_the_model`

          The label **AtM Development** identifies only the Flatpak update source.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan flatpak-repo-publish
          git rm -rf .
          git clean -fdx

          cp -a "$PUBLISH_DIR/repo" .
          cp -a "$PUBLISH_DIR/atm-development.flatpakrepo" .
          cp -a "$PUBLISH_DIR/README.md" .
          git add -A
          git commit -m "Publish Ask the Model development Flatpak"
          git push --force origin HEAD:flatpak-repo
