name: Flatpak

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/elementary/flatpak-platform/runtime:8
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore development repository history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if git fetch origin flatpak-repo:refs/remotes/origin/flatpak-repo 2>/dev/null; then
            git archive origin/flatpak-repo repo | tar -x
          fi

      - name: Validate release metadata
        shell: bash
        run: bash scripts/validate_release_metadata.sh

      - name: Validate README contract
        shell: bash
        run: bash scripts/validate_readme_contract.sh

      - name: Validate release publication contract
        shell: bash
        run: bash scripts/validate_release_workflow.sh

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: AskTheModel.flatpak
          artifact-name: AskTheModel-x86_64.flatpak
          manifest-path: io.github.laurentiustaicu.ask_the_model.yml
          run-tests: true
          repository-name: appcenter
          repository-url: https://flatpak.elementary.io/repo.flatpakrepo
          repo-dir: repo
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Stage verified publication inputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atm-flatpak-publication
          path: |
            AskTheModel.flatpak
            repo
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/elementary/flatpak-platform/runtime:8
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified publication inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atm-flatpak-publication
          path: .

      - name: Publish versioned GitHub release and bundle when needed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            const meson = fs.readFileSync('meson.build', 'utf8');
            const match = meson.match(/version:\s*'([^']+)'/);
            if (!match) {
              core.setFailed('Could not read the project version from meson.build');
              return;
            }

            const version = match[1];
            const tag = `v${version}`;
            const releasePath = `releases/${tag}.md`;
            const assetPath = 'AskTheModel.flatpak';
            const assetName = 'AskTheModel.flatpak';

            if (!fs.existsSync(releasePath)) {
              core.info(`No release notes found at ${releasePath}; skipping GitHub Release publication.`);
              return;
            }

            if (!fs.existsSync(assetPath)) {
              core.setFailed(`Expected release bundle ${assetPath} was not produced.`);
              return;
            }

            const body = fs.readFileSync(releasePath, 'utf8');
            const subtitleMatch = body.match(/\*\*([^*]+)\*\*/);
            let subtitle = subtitleMatch ? subtitleMatch[1].trim() : 'Release';
            subtitle = subtitle.replace(/\s+—\s+\d{4}-\d{2}-\d{2}$/, '');
            const releaseName = `${tag} — ${subtitle}`;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const {
              selectReleaseForVersion,
              assertReleaseTagMatchesCommit,
              assertDraftAssetDigestMatches,
              classifyReleaseTagState,
              assertDraftCanCreateMissingTag,
            } = require('./scripts/release_tag_guard.cjs');

            let release;
            try {
              release = selectReleaseForVersion(releases, tag, releaseName);
            } catch (error) {
              core.setFailed(error.message);
              return;
            }

            if (
              release &&
              !release.draft &&
              Array.isArray(release.assets) &&
              release.assets.some((asset) => asset.name === assetName)
            ) {
              core.info(
                `Published GitHub Release ${tag} already contains ${assetName}; leaving it unchanged.`
              );
              return;
            }
            if (
              release &&
              !release.draft &&
              Array.isArray(release.assets) &&
              release.assets.some((asset) => asset.name === assetName)
            ) {
              core.info(
                `Published GitHub Release ${tag} already contains ${assetName}; leaving it unchanged.`
              );
              return;
            }

            async function getTagRefOrNull() {
              try {
                const response = await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tag}`,
                });
                return response.data;
              } catch (error) {
                if (error.status === 404) {
                  return null;
                }
                throw error;
              }
            }

            let tagRef = await getTagRefOrNull();

            // A previous run may have left an empty draft release before it
            // could create its version tag. Retarget that draft only when the
            // old target is an exact commit ancestor of this push and no tag or
            // asset exists; never retarget a published release or a populated draft.
            if (release && release.draft && !tagRef && release.target_commitish !== context.sha) {
              const previousTarget = release.target_commitish;
              if (!Array.isArray(release.assets) || release.assets.length !== 0) {
                core.setFailed(
                  `Refusing to retarget draft release ${tag}: it is not empty and has no verified tag ref.`
                );
                return;
              }
              if (!/^[0-9a-f]{40}$/.test(previousTarget || '')) {
                core.setFailed(
                  `Refusing to retarget draft release ${tag}: previous target is not an exact commit SHA.`
                );
                return;
              }

              let comparison;
              try {
                comparison = (await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: previousTarget,
                  head: context.sha,
                })).data;
              } catch (error) {
                core.setFailed(
                  `Could not verify ancestry for empty draft release ${tag}: ${error.message}`
                );
                return;
              }

              if (
                comparison.status !== 'ahead' ||
                comparison.base_commit?.sha !== previousTarget ||
                comparison.merge_base_commit?.sha !== previousTarget
              ) {
                core.setFailed(
                  `Refusing to retarget draft release ${tag}: previous target ${previousTarget} is not an ancestor of workflow commit ${context.sha}.`
                );
                return;
              }

              let retargeted;
              try {
                retargeted = await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  target_commitish: context.sha,
                });
              } catch (error) {
                core.setFailed(
                  `Could not retarget empty draft release ${tag}: ${error.message}`
                );
                return;
              }
              release = retargeted.data;
              if (release.target_commitish !== context.sha) {
                core.setFailed(
                  `GitHub did not retarget draft release ${tag} to workflow commit ${context.sha}.`
                );
                return;
              }
              core.info(
                `Retargeted empty draft release ${tag} after verifying that its previous target is an ancestor of this workflow commit.`
              );
            }

            let disposition;
            try {
              disposition = classifyReleaseTagState({
                release,
                tagRef,
                currentSha: context.sha,
                assetName,
                tag,
              });
            } catch (error) {
              core.setFailed(error.message);
              return;
            }

            if (disposition === 'published-noop') {
              core.info(
                `Published GitHub Release ${tag} already contains ${assetName}; leaving it unchanged.`
              );
              return;
            }

            if (disposition === 'repair-published') {
              core.warning(
                `Published mutable release ${tag} is missing ${assetName}; repairing the legacy release only because its tag matches this workflow commit.`
              );
            }

            if (disposition === 'resume-draft') {
              core.info(`Resuming existing draft GitHub Release ${tag} after tag preflight.`);
            }

            if (disposition === 'resume-draft-create-tag') {
              core.info(
                `Resuming empty draft GitHub Release ${tag}; will create and verify its missing direct tag before uploading assets.`
              );
            }

            if (!release) {
              const response = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: releaseName,
                body,
                draft: true,
                prerelease: false,
              });

              release = response.data;
              if (!release.draft) {
                core.setFailed(
                  `GitHub returned a non-draft release for ${tag}; refusing to attach or publish the verified bundle.`
                );
                return;
              }
              core.info(
                `Created draft GitHub Release ${tag}; verifying the resulting tag before asset upload.`
              );
            }


            // A draft release does not reliably materialize its git ref when
            // createRelease is called with draft=true. Create the missing direct
            // ref only after verifying that this is the empty draft for this exact
            // workflow commit; then read the ref back and validate it before upload.
            tagRef = await getTagRefOrNull();
            if (!tagRef) {
              try {
                assertDraftCanCreateMissingTag(release, context.sha, tag);
              } catch (error) {
                core.setFailed(error.message);
                return;
              }

              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tag}`,
                  sha: context.sha,
                });
              } catch (error) {
                // A concurrent publisher can win the create-ref race. Read the
                // actual ref back and accept it only if the strict verifier below
                // proves it points directly at this exact workflow commit.
                if (error.status !== 422) {
                  core.setFailed(
                    `Could not create direct tag ref for ${tag}: ${error.message}`
                  );
                  return;
                }
              }

              tagRef = await getTagRefOrNull();
            }

            try {
              assertReleaseTagMatchesCommit(tagRef, context.sha, tag);
            } catch (error) {
              core.setFailed(error.message);
              return;
            }
            core.info(`Verified direct release tag ${tag} at workflow commit ${context.sha}.`);

            let existingAsset = release.assets.find(
              (asset) => asset.name === assetName
            );

            // Reuse an existing draft asset only when GitHub's recorded digest
            // matches the exact bundle produced and tested by this workflow.
            // A stale or unverifiable same-name asset must never be published.
            if (release.draft && existingAsset) {
              const expectedAssetDigest = 'sha256:' + crypto
                .createHash('sha256')
                .update(fs.readFileSync(assetPath))
                .digest('hex');
              try {
                assertDraftAssetDigestMatches(
                  existingAsset,
                  expectedAssetDigest,
                  assetName
                );
              } catch (error) {
                core.setFailed(error.message);
                return;
              }
            }

            if (!existingAsset) {
              // Revalidate on every asset-upload path, including the narrow
              // repair of a mutable published release missing its asset.
              // The early no-op path above protects published releases that
              // already contain the bundle; this check closes the upload race.
              const verifiedTagRef = await getTagRefOrNull();
              try {
                assertReleaseTagMatchesCommit(verifiedTagRef, context.sha, tag);
              } catch (error) {
                core.setFailed(error.message);
                return;
              }

              const data = fs.readFileSync(assetPath);

              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: assetName,
                data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
              });

              core.info(`Uploaded ${assetName} to GitHub Release ${tag}.`);
            } else {
              core.info(
                `Draft release asset ${assetName} already exists; reusing it.`
              );
            }

            if (!release.draft) {
              return;
            }

            if (release.draft) {
              // Close the upload-time race as well: revalidate the actual tag
              // immediately before turning the draft into a published release.
              const finalTagRef = await getTagRefOrNull();
              try {
                assertReleaseTagMatchesCommit(finalTagRef, context.sha, tag);
              } catch (error) {
                core.setFailed(error.message);
                return;
              }
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              tag_name: tag,
              target_commitish: context.sha,
              name: releaseName,
              body,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });

            core.info(
              `Published GitHub Release ${tag} only after all release assets were attached.`
            );

      - name: Finalize AtM development repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p repo/refs/remotes

          flatpak build-update-repo repo \
            --generate-static-deltas \
            --title="AtM Development" \
            --comment="Development updates for Ask the Model" \
            --description="Automatically published development builds of Ask the Model from the main branch." \
            --homepage="https://github.com/LaurentiuStaicu/ask-the-model" \
            --icon="https://raw.githubusercontent.com/LaurentiuStaicu/ask-the-model/main/data/icons/64.png" \
            --default-branch=master

      - name: Publish AtM development repository
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$WORKSPACE"

          PUBLISH_DIR="$(mktemp -d)"
          cp -a "$WORKSPACE/repo" "$PUBLISH_DIR/repo"

          cat > "$PUBLISH_DIR/atm-development.flatpakrepo" <<'EOF'
          [Flatpak Repo]
          Title=AtM Development
          Url=https://raw.githubusercontent.com/LaurentiuStaicu/ask-the-model/flatpak-repo/repo/
          Homepage=https://github.com/LaurentiuStaicu/ask-the-model
          Comment=Development updates for Ask the Model
          Description=Automatically published development builds of Ask the Model.
          Icon=https://raw.githubusercontent.com/LaurentiuStaicu/ask-the-model/main/data/icons/64.png
          EOF

          printf '%s\n' "$GITHUB_SHA" > "$PUBLISH_DIR/SOURCE_COMMIT"

          cat > "$PUBLISH_DIR/README.md" <<'EOF'
          # Ask the Model — development Flatpak repository

          This branch is generated automatically from `main`.

          Application name: **Ask the Model**

          Application ID: `io.github.laurentiustaicu.ask_the_model`

          The label **AtM Development** identifies only the Flatpak update source.

          Source main commit:
          EOF
          printf '\n`%s`\n' "$GITHUB_SHA" >> "$PUBLISH_DIR/README.md"

          git -C "$WORKSPACE" checkout --orphan flatpak-repo-publish
          git -C "$WORKSPACE" rm -rf .
          git -C "$WORKSPACE" clean -fdx

          cp -a "$PUBLISH_DIR/repo" "$WORKSPACE/repo"
          cp -a "$PUBLISH_DIR/atm-development.flatpakrepo" "$WORKSPACE/atm-development.flatpakrepo"
          cp -a "$PUBLISH_DIR/README.md" "$WORKSPACE/README.md"
          cp -a "$PUBLISH_DIR/SOURCE_COMMIT" "$WORKSPACE/SOURCE_COMMIT"

          git -C "$WORKSPACE" add -A
          git -C "$WORKSPACE" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish Ask the Model development Flatpak from ${GITHUB_SHA}"
          git -C "$WORKSPACE" push --force origin HEAD:flatpak-repo
