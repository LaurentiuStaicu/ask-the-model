name: C0-M1 real capacity measurement

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/retrieval-v1/benchmark.json'
      - 'src/archive_extract.c'
      - 'src/archive_extract.h'
      - 'src/capacity_measurement.c'
      - 'src/capacity_measurement.h'
      - 'src/cff_version.c'
      - 'src/cff_version.h'
      - 'src/repository_ingest.c'
      - 'src/repository_ingest.h'
      - 'src/repository_manifest.c'
      - 'src/repository_manifest.h'
      - 'src/repository_storage.c'
      - 'src/repository_storage.h'
      - 'src/repository_sources.c'
      - 'src/repository_sources.h'
      - 'src/markdown_sections.c'
      - 'src/markdown_sections.h'
      - 'src/csv_table.c'
      - 'src/csv_table.h'
      - 'src/structured_json.c'
      - 'src/structured_json.h'
      - 'src/retrieval_index.c'
      - 'src/retrieval_index.h'
      - 'data/schemas/retrieval-index-v2.sql'
      - 'data/io.github.laurentiustaicu.ask_the_model.gresource.xml'
      - 'tests/capacity_measurement_real_runner.c'
      - '.github/workflows/capacity-measurement-real.yml'

permissions:
  contents: read

concurrency:
  group: capacity-c0-m1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout AtM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install measurement build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            pkg-config \
            libarchive-dev \
            libglib2.0-dev \
            libglib2.0-bin \
            libjson-glib-dev \
            libsqlite3-dev \
            libyaml-dev

      - name: Compile real capacity measurement runner
        shell: bash
        run: |
          set -euo pipefail

          glib-compile-resources \
            data/io.github.laurentiustaicu.ask_the_model.gresource.xml \
            --sourcedir=data \
            --generate-source \
            --target=/tmp/atm-resources.c

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -Isrc \
            $(pkg-config --cflags \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0) \
            -c tests/capacity_measurement_real_runner.c \
            -o /tmp/capacity-measurement-real-runner.o

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Isrc \
            src/capacity_measurement.c \
            src/cff_version.c \
            src/archive_extract.c \
            src/repository_manifest.c \
            src/repository_storage.c \
            src/repository_ingest.c \
            src/repository_sources.c \
            src/markdown_sections.c \
            src/csv_table.c \
            src/structured_json.c \
            src/retrieval_index.c \
            /tmp/capacity-measurement-real-runner.o \
            /tmp/atm-resources.c \
            $(pkg-config --cflags --libs \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0 \
              sqlite3 \
              libarchive \
              yaml-0.1) \
            -o /tmp/atm-capacity-real-runner

      - name: Measure pinned EWD CBD RMD snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ATM_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/atm-c0-m1/results

          python3 - <<'PY' >/tmp/atm-c0-m1-corpus.tsv
          import json

          with open(
              "benchmarks/retrieval-v1/benchmark.json",
              encoding="utf-8",
          ) as handle:
              benchmark = json.load(handle)

          for item in benchmark["corpus"]:
              print(
                  item["repository_id"],
                  item["snapshot_sha"],
                  sep="\t",
              )
          PY

          while IFS=$'\t' read -r repository_id snapshot_sha; do
            case "$repository_id" in
              ewd)
                repository="empirical-world3-dynamics"
                acronym="EWD"
                display_name="Empirical World3 Dynamics"
                ;;
              cbd)
                repository="cognitive-belief-dynamics"
                acronym="CBD"
                display_name="Cognitive Belief Dynamics"
                ;;
              rmd)
                repository="romanian-monetary-dynamics"
                acronym="RMD"
                display_name="Romanian Monetary Dynamics"
                ;;
              *)
                printf 'Unsupported C0-M1 repository: %s\n' "$repository_id" >&2
                exit 1
                ;;
            esac

            work="/tmp/atm-c0-m1/$repository_id"
            archive_dir="$work/cache/repository-staging/$repository_id"
            archive="$archive_dir/$snapshot_sha.tar.gz"
            output="/tmp/atm-c0-m1/results/$repository_id.json"

            mkdir -p "$archive_dir" "$work/data" "$work/state"

            curl \
              --fail \
              --location \
              --retry 3 \
              --silent \
              --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/LaurentiuStaicu/$repository/tarball/$snapshot_sha" \
              --output "$archive"

            test -s "$archive"

            /tmp/atm-capacity-real-runner \
              "$ATM_SOURCE_COMMIT" \
              "$repository_id" \
              "$acronym" \
              "$display_name" \
              "$snapshot_sha" \
              "$archive" \
              "$work" \
              "$output"

            python3 -m json.tool "$output" >/dev/null
          done </tmp/atm-c0-m1-corpus.tsv

      - name: Aggregate measurement artifact
        shell: bash
        env:
          ATM_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import pathlib

          results_dir = pathlib.Path("/tmp/atm-c0-m1/results")
          records = []

          for path in sorted(results_dir.glob("*.json")):
              with path.open(encoding="utf-8") as handle:
                  records.append(json.load(handle))

          if {record["repository_id"] for record in records} != {
              "ewd", "cbd", "rmd"
          }:
              raise SystemExit(
                  "C0-M1 result set does not contain exactly EWD/CBD/RMD"
              )

          artifact = {
              "schema_version": 1,
              "measurement_id": "atm-c0-m1-real-v1",
              "atm_source_commit": records[0]["atm_source_commit"],
              "workflow_commit": __import__("os").environ.get(
                  "ATM_WORKFLOW_COMMIT"
              ),
              "records": records,
          }

          output = results_dir / "c0-m1-capacity-measurements.json"
          output.write_text(
              json.dumps(
                  artifact,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )

          print(output.read_text(encoding="utf-8"))
          PY

      - name: Upload C0-M1 measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atm-c0-m1-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/atm-c0-m1/results/*.json
          if-no-files-found: error
          retention-days: 90
