name: PRES-09 GTK Application E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/pres09_gtk_application_e2e_test.vala'
      - 'tests/fixtures/chart01/**'
      - 'meson.build'
      - '.github/workflows/pres09-gtk-application-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout complete EWD fixture at the originally admitted immutable snapshot
        uses: actions/checkout@v4
        with:
          repository: LaurentiuStaicu/empirical-world3-dynamics
          ref: d9e249339663015f6d1c05752338a955bf64ad0b
          path: ewd-initial-full
          fetch-depth: 1
      - name: Checkout complete EWD fixture at the current admitted immutable snapshot
        uses: actions/checkout@v4
        with:
          repository: LaurentiuStaicu/empirical-world3-dynamics
          ref: dc710d8e604c0fff713a3acfdb18ab47a1a902bb
          path: ewd-full
          fetch-depth: 1
      - name: Checkout RMD at the admitted immutable BNR BLS C01 snapshot
        uses: actions/checkout@v4
        with:
          repository: LaurentiuStaicu/romanian-monetary-dynamics
          ref: e43eb4e899f123d3b1aa0f6e20b7c8ed35434170
          path: rmd-full
          fetch-depth: 1
      - name: Install GTK Application test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson \
            ninja-build \
            valac \
            pkg-config \
            xvfb \
            xauth \
            dbus-x11 \
            libgtk-4-dev \
            libgranite-7-dev \
            libsoup-3.0-dev \
            libjson-glib-dev \
            libsqlite3-dev \
            libarchive-dev \
            libyaml-dev
      - name: Compile test-only GTK Application
        run: |
          set -euo pipefail
          meson setup build --buildtype=debug
          ninja -C build pres09-gtk-application-e2e-test
      - name: Run live, process-relaunch History, and tampered-source E2E
        env:
          ATM_CHART01_FIXTURE: tests/fixtures/chart01
          ATM_PRES09_FULL_EWD_INITIAL_ROOT: ewd-initial-full
          ATM_PRES09_FULL_EWD_ROOT: ewd-full
          ATM_PRES09_FULL_RMD_ROOT: rmd-full
          GTK_A11Y: none
          GTK_IM_MODULE: gtk-im-context-simple
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          G_DEBUG: fatal-warnings
          LIBGL_ALWAYS_SOFTWARE: '1'
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1360x900x24' \
            dbus-run-session -- ./build/pres09-gtk-application-e2e-test
