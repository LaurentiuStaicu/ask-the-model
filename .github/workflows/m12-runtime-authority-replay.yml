name: A1-M12 runtime authority replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/RepositoryLifecycleService.vala'
      - 'src/RepositoryNative.vala'
      - 'src/repository_ingest.c'
      - 'src/repository_ingest.h'
      - 'src/snapshot_seal.c'
      - 'src/snapshot_seal.h'
      - 'src/snapshot_durability.c'
      - 'src/snapshot_durability.h'
      - 'src/snapshot_namespace_durability.c'
      - 'src/snapshot_namespace_durability.h'
      - 'src/repository_ui_bridge.c'
      - 'src/repository_ui_bridge.h'
      - 'src/repository_capacity_ui_bridge.c'
      - 'src/repository_capacity_ui_bridge.h'
      - 'src/control_state.c'
      - 'src/control_state.h'
      - 'tests/m12_runtime_authority_replay_helper.c'
      - 'tests/fault_injection_support.c'
      - 'tests/fault_injection_support.h'
      - 'scripts/run_m12_runtime_authority_replay.sh'
      - '.github/workflows/m12-runtime-authority-replay.yml'
      - 'meson.build'
  push:
    branches:
      - main
    paths:
      - 'src/RepositoryLifecycleService.vala'
      - 'src/RepositoryNative.vala'
      - 'src/repository_ingest.c'
      - 'src/repository_ingest.h'
      - 'src/snapshot_seal.c'
      - 'src/snapshot_seal.h'
      - 'src/snapshot_durability.c'
      - 'src/snapshot_durability.h'
      - 'src/snapshot_namespace_durability.c'
      - 'src/snapshot_namespace_durability.h'
      - 'src/repository_ui_bridge.c'
      - 'src/repository_ui_bridge.h'
      - 'src/repository_capacity_ui_bridge.c'
      - 'src/repository_capacity_ui_bridge.h'
      - 'src/control_state.c'
      - 'src/control_state.h'
      - 'tests/m12_runtime_authority_replay_helper.c'
      - 'tests/fault_injection_support.c'
      - 'tests/fault_injection_support.h'
      - 'scripts/run_m12_runtime_authority_replay.sh'
      - '.github/workflows/m12-runtime-authority-replay.yml'
      - 'meson.build'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout AtM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y             build-essential             pkg-config             libglib2.0-dev             libjson-glib-dev             libsqlite3-dev             libarchive-dev             libyaml-dev

      - name: Compile M12 runtime authority helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-m12
          cc -std=c11 -O2 -Wall -Wextra             -Isrc -Itests             src/control_state.c             src/cff_version.c             src/archive_extract.c             src/capacity_admission_model.c             src/capacity_operation_plan.c             src/capacity_measurement.c             src/repository_capacity_policy.c             src/repository_capacity_admission.c             src/repository_capacity_ui_bridge.c             src/repository_manifest.c             src/repository_storage.c             src/repository_mutation_lease.c             src/repository_ingest.c             src/snapshot_seal.c             src/snapshot_durability.c             src/snapshot_namespace_durability.c             src/repository_ui_bridge.c             src/repository_sources.c             src/markdown_sections.c             src/csv_table.c             src/structured_json.c             src/retrieval_index.c             src/coordination_lease.c             src/repository_generation_lease.c             src/retrieval_index_lifecycle.c             src/retrieval_query.c             src/retrieval_rank.c             src/retrieval_scope.c             src/retrieval_normalize.c             src/retrieval_router.c             src/retrieval_conversation.c             src/grounding_context.c             src/citation_labels.c             src/conversation_grounding.c             tests/fault_injection_support.c             tests/m12_runtime_authority_replay_helper.c             -o build-m12/m12-runtime-authority-replay-helper             $(pkg-config --cflags --libs               glib-2.0 gio-2.0 json-glib-1.0 sqlite3 libarchive yaml-0.1)

      - name: Run M12 process-interruption matrix
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/run_m12_runtime_authority_replay.sh
          scripts/run_m12_runtime_authority_replay.sh             build-m12/m12-runtime-authority-replay.json             build-m12/m12-runtime-authority-replay-helper
          python3 -m json.tool             build-m12/m12-runtime-authority-replay.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("build-m12/m12-runtime-authority-replay.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          summary = data["summary"]

          assert summary["all_pre_authority_interruptions_empty_valid"] is True
          assert summary["after_authority_new_valid"] is True
          assert summary["seal_mismatch_fail_closed"] is True
          assert data["protocol"]["process_interruption_only"] is True
          assert data["protocol"]["physical_power_loss_claim"] is False
          assert data["runtime_fault_qualification_complete"] is False
          PY

      - name: Upload M12 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-m12-runtime-authority-replay
          path: build-m12/m12-runtime-authority-replay.json
          if-no-files-found: error
          retention-days: 30
