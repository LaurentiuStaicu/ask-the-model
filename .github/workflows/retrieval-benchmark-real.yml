name: Frozen R5 retrieval benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/retrieval-v1/**'
      - 'scripts/evaluate_retrieval_benchmark.py'
      - 'src/cff_version.c'
      - 'src/cff_version.h'
      - 'src/repository_sources.c'
      - 'src/repository_sources.h'
      - 'src/markdown_sections.c'
      - 'src/markdown_sections.h'
      - 'src/csv_table.c'
      - 'src/csv_table.h'
      - 'src/structured_json.c'
      - 'src/structured_json.h'
      - 'src/retrieval_index.c'
      - 'src/retrieval_index.h'
      - 'src/retrieval_index_lifecycle.c'
      - 'src/retrieval_index_lifecycle.h'
      - 'src/retrieval_query.c'
      - 'src/retrieval_query.h'
      - 'src/retrieval_rank.c'
      - 'src/retrieval_rank.h'
      - 'src/retrieval_scope.c'
      - 'src/retrieval_scope.h'
      - 'src/retrieval_normalize.c'
      - 'src/retrieval_normalize.h'
      - 'src/retrieval_router.c'
      - 'src/retrieval_router.h'
      - 'src/retrieval_conversation.c'
      - 'src/retrieval_conversation.h'
      - 'src/retrieval_policy.h'
      - 'src/grounding_context.c'
      - 'src/grounding_context.h'
      - 'data/schemas/retrieval-index-v2.sql'
      - 'data/schemas/retrieval-benchmark-v1.schema.json'
      - 'data/schemas/retrieval-benchmark-run-v1.schema.json'
      - 'data/io.github.laurentiustaicu.ask_the_model.gresource.xml'
      - 'tests/retrieval_benchmark_runner.c'
      - '.github/workflows/retrieval-benchmark-real.yml'
  push:
    branches:
      - main
    paths:
      - 'benchmarks/retrieval-v1/**'
      - 'scripts/evaluate_retrieval_benchmark.py'
      - 'src/cff_version.c'
      - 'src/repository_sources.c'
      - 'src/markdown_sections.c'
      - 'src/csv_table.c'
      - 'src/structured_json.c'
      - 'src/retrieval_index.c'
      - 'src/retrieval_index_lifecycle.c'
      - 'src/retrieval_query.c'
      - 'src/retrieval_rank.c'
      - 'src/retrieval_scope.c'
      - 'src/retrieval_normalize.c'
      - 'src/retrieval_router.c'
      - 'src/retrieval_conversation.c'
      - 'src/retrieval_policy.h'
      - 'src/grounding_context.c'
      - 'data/schemas/retrieval-index-v2.sql'
      - 'data/schemas/retrieval-benchmark-v1.schema.json'
      - 'data/schemas/retrieval-benchmark-run-v1.schema.json'
      - 'data/io.github.laurentiustaicu.ask_the_model.gresource.xml'
      - 'tests/retrieval_benchmark_runner.c'
      - '.github/workflows/retrieval-benchmark-real.yml'

permissions:
  contents: read

concurrency:
  group: retrieval-benchmark-r5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout AtM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install backend build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            pkg-config \
            libglib2.0-dev \
            libglib2.0-bin \
            libjson-glib-dev \
            libsqlite3-dev \
            libyaml-dev

      - name: Checkout benchmark-pinned repository snapshots
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .integration

          python3 - <<'PY' >/tmp/atm-r5-corpus.tsv
          import json

          with open(
              "benchmarks/retrieval-v1/benchmark.json",
              encoding="utf-8",
          ) as handle:
              benchmark = json.load(handle)

          for item in benchmark["corpus"]:
              print(
                  item["repository_id"],
                  item["snapshot_sha"],
                  sep="\t",
              )
          PY

          while IFS=$'\t' read -r repository_id snapshot_sha; do
            case "$repository_id" in
              ewd)
                remote="https://github.com/LaurentiuStaicu/empirical-world3-dynamics.git"
                root_env="ATM_BENCH_EWD_ROOT"
                sha_env="ATM_BENCH_EWD_SHA"
                ;;
              cbd)
                remote="https://github.com/LaurentiuStaicu/cognitive-belief-dynamics.git"
                root_env="ATM_BENCH_CBD_ROOT"
                sha_env="ATM_BENCH_CBD_SHA"
                ;;
              rmd)
                remote="https://github.com/LaurentiuStaicu/romanian-monetary-dynamics.git"
                root_env="ATM_BENCH_RMD_ROOT"
                sha_env="ATM_BENCH_RMD_SHA"
                ;;
              *)
                printf 'Unsupported benchmark repository: %s\n' "$repository_id" >&2
                exit 1
                ;;
            esac

            destination="$GITHUB_WORKSPACE/.integration/$repository_id"
            git init -q "$destination"
            git -C "$destination" remote add origin "$remote"
            git -C "$destination" fetch --depth=1 origin "$snapshot_sha"
            git -C "$destination" checkout -q --detach FETCH_HEAD

            actual_sha="$(git -C "$destination" rev-parse HEAD)"
            test "$actual_sha" = "$snapshot_sha"

            rm -rf "$destination/.git"

            {
              echo "$root_env=$destination"
              echo "$sha_env=$actual_sha"
            } >> "$GITHUB_ENV"

            printf 'Pinned %s %s\n' "$repository_id" "$actual_sha"
          done </tmp/atm-r5-corpus.tsv

      - name: Compile deterministic benchmark runner
        shell: bash
        run: |
          set -euo pipefail

          glib-compile-resources \
            data/io.github.laurentiustaicu.ask_the_model.gresource.xml \
            --sourcedir=data \
            --generate-source \
            --target=/tmp/atm-resources.c

          # Keep the new runner itself warning-clean without turning
          # pre-existing backend warnings into unrelated R5 failures.
          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -Isrc \
            $(pkg-config --cflags \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0) \
            -c tests/retrieval_benchmark_runner.c \
            -o /tmp/retrieval-benchmark-runner.o

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Isrc \
            src/cff_version.c \
            src/repository_sources.c \
            src/markdown_sections.c \
            src/csv_table.c \
            src/structured_json.c \
            src/retrieval_index.c \
            src/retrieval_index_lifecycle.c \
            src/retrieval_query.c \
            src/retrieval_rank.c \
            src/retrieval_scope.c \
            src/retrieval_normalize.c \
            src/retrieval_router.c \
            src/retrieval_conversation.c \
            src/grounding_context.c \
            /tmp/retrieval-benchmark-runner.o \
            /tmp/atm-resources.c \
            $(pkg-config --cflags --libs \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0 \
              sqlite3 \
              yaml-0.1) \
            -o /tmp/atm-retrieval-benchmark-runner

      - name: Execute frozen benchmark
        shell: bash
        run: |
          set -euo pipefail

          /tmp/atm-retrieval-benchmark-runner \
            benchmarks/retrieval-v1/benchmark.json \
            /tmp/atm-retrieval-benchmark-run.json \
            "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          python3 -m json.tool \
            /tmp/atm-retrieval-benchmark-run.json \
            >/dev/null

          python3 scripts/evaluate_retrieval_benchmark.py \
            benchmarks/retrieval-v1/benchmark.json \
            /tmp/atm-retrieval-benchmark-run.json \
            --pretty \
            | tee /tmp/atm-retrieval-benchmark-evaluation.json

      - name: Execute production-policy shadow benchmark
        shell: bash
        run: |
          set -euo pipefail

          /tmp/atm-retrieval-benchmark-runner \
            benchmarks/retrieval-v1/benchmark.json \
            /tmp/atm-retrieval-production-policy-run.json \
            "github-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            production

          python3 -m json.tool \
            /tmp/atm-retrieval-production-policy-run.json \
            >/dev/null

          python3 scripts/evaluate_retrieval_benchmark.py \
            benchmarks/retrieval-v1/benchmark.json \
            /tmp/atm-retrieval-production-policy-run.json \
            --pretty \
            | tee /tmp/atm-retrieval-production-policy-evaluation.json

          python3 - <<'PY'
          import json

          with open(
              "/tmp/atm-retrieval-production-policy-evaluation.json",
              encoding="utf-8",
          ) as handle:
              evaluation = json.load(handle)

          metrics = evaluation["metrics"]
          print("Production-policy shadow metrics:")
          for name in (
              "exact_id_success_at_1",
              "ndcg_at_5",
              "canonical_required_recall_at_5",
              "context_precision",
              "context_required_recall",
              "context_source_count_mean",
              "context_source_count_max",
              "evidence_bytes_mean",
              "evidence_bytes_max",
              "retrieval_latency_ms_median",
              "retrieval_latency_ms_p95",
          ):
              print(f"  {name}: {metrics.get(name)}")

          print(
              "  existing_quality_gates_pass: "
              f"{evaluation['passes_provisional_targets']}"
          )
          PY

      - name: Execute candidate context-policy sweep
        shell: bash
        run: |
          set -euo pipefail

          for policy in             candidate-results5             candidate-sources8             candidate-bytes16k             candidate-compact
          do
            stem="/tmp/atm-retrieval-${policy}"

            /tmp/atm-retrieval-benchmark-runner               benchmarks/retrieval-v1/benchmark.json               "${stem}-run.json"               "github-${policy}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"               "${policy}"

            python3 scripts/evaluate_retrieval_benchmark.py               benchmarks/retrieval-v1/benchmark.json               "${stem}-run.json"               --pretty               > "${stem}-evaluation.json"
          done

          python3 - <<'PY'
          import json

          policies = [
              "production",
              "candidate-results5",
              "candidate-sources8",
              "candidate-bytes16k",
              "candidate-compact",
          ]

          def load(policy):
              if policy == "production":
                  path = (
                      "/tmp/atm-retrieval-production-policy-"
                      "evaluation.json"
                  )
              else:
                  path = f"/tmp/atm-retrieval-{policy}-evaluation.json"

              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)

          baseline = load("production")
          baseline_metrics = baseline["metrics"]
          rows = []

          for policy in policies:
              evaluation = load(policy)
              metrics = evaluation["metrics"]

              rows.append(
                  {
                      "policy": policy,
                      "context_precision": metrics.get(
                          "context_precision"
                      ),
                      "context_required_recall": metrics.get(
                          "context_required_recall"
                      ),
                      "context_source_count_mean": metrics.get(
                          "context_source_count_mean"
                      ),
                      "context_source_count_max": metrics.get(
                          "context_source_count_max"
                      ),
                      "evidence_bytes_mean": metrics.get(
                          "evidence_bytes_mean"
                      ),
                      "evidence_bytes_max": metrics.get(
                          "evidence_bytes_max"
                      ),
                      "canonical_required_recall_at_5": metrics.get(
                          "canonical_required_recall_at_5"
                      ),
                      "ndcg_at_5": metrics.get("ndcg_at_5"),
                      "exact_id_success_at_1": metrics.get(
                          "exact_id_success_at_1"
                      ),
                      "passes_existing_quality_gates": evaluation[
                          "passes_provisional_targets"
                      ],
                      "delta_context_precision": (
                          metrics.get("context_precision")
                          - baseline_metrics.get("context_precision")
                      ),
                      "delta_context_required_recall": (
                          metrics.get("context_required_recall")
                          - baseline_metrics.get(
                              "context_required_recall"
                          )
                      ),
                      "delta_evidence_bytes_mean": (
                          metrics.get("evidence_bytes_mean")
                          - baseline_metrics.get(
                              "evidence_bytes_mean"
                          )
                      ),
                  }
              )

          with open(
              "/tmp/atm-retrieval-policy-sweep-summary.json",
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(
                  {
                      "schema_version": 1,
                      "baseline": "production",
                      "policies": rows,
                  },
                  handle,
                  indent=2,
                  sort_keys=True,
              )
              handle.write("\n")

          print("Candidate context-policy sweep:")
          for row in rows:
              print(
                  "  "
                  f"{row['policy']}: "
                  f"precision={row['context_precision']:.6f} "
                  f"context_recall={row['context_required_recall']:.6f} "
                  f"sources_mean={row['context_source_count_mean']:.3f} "
                  f"sources_max={row['context_source_count_max']} "
                  f"bytes_mean={row['evidence_bytes_mean']:.1f} "
                  f"bytes_max={row['evidence_bytes_max']} "
                  f"quality_gates={row['passes_existing_quality_gates']}"
              )
          PY

      - name: Enforce provisional R5 gates
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          with open(
              "/tmp/atm-retrieval-benchmark-evaluation.json",
              encoding="utf-8",
          ) as handle:
              evaluation = json.load(handle)

          if not evaluation["passes_provisional_targets"]:
              failed = [
                  name
                  for name, passed in evaluation["gates"].items()
                  if not passed
              ]
              raise SystemExit(
                  "R5 provisional gates failed: " + ", ".join(failed)
              )

          print("PASS: all provisional R5 retrieval gates are satisfied.")
          PY

      - name: Upload benchmark run and evaluation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atm-r5-retrieval-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/atm-retrieval-benchmark-run.json
            /tmp/atm-retrieval-benchmark-evaluation.json
            /tmp/atm-retrieval-production-policy-run.json
            /tmp/atm-retrieval-production-policy-evaluation.json
            /tmp/atm-retrieval-candidate-results5-run.json
            /tmp/atm-retrieval-candidate-results5-evaluation.json
            /tmp/atm-retrieval-candidate-sources8-run.json
            /tmp/atm-retrieval-candidate-sources8-evaluation.json
            /tmp/atm-retrieval-candidate-bytes16k-run.json
            /tmp/atm-retrieval-candidate-bytes16k-evaluation.json
            /tmp/atm-retrieval-candidate-compact-run.json
            /tmp/atm-retrieval-candidate-compact-evaluation.json
            /tmp/atm-retrieval-policy-sweep-summary.json
          if-no-files-found: warn
          retention-days: 14
