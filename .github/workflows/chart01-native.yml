name: CHART-01 native candidate

on:
  pull_request:
    paths:
      - 'src/annual_series_candidate.*'
      - 'src/energy_institute_admission.*'
      - 'src/energy_institute_candidate.*'
      - 'src/energy_institute_evidence.*'
      - 'src/series_evidence.*'
      - 'src/series_evidence_adapters.*'
      - 'src/series_sra.*'
      - 'src/series_adapter.*'
      - 'src/series_contract.*'
      - 'src/verified_series_contract.*'
      - 'tests/energy_institute_admission_test.c'
      - 'tests/energy_institute_evidence_test.c'
      - 'tests/series_evidence_equivalence_test.c'
      - 'tests/series_sra_equivalence_test.c'
      - 'tests/series_adapter_test.c'
      - 'tests/series_contract_test.c'
      - 'tests/verified_series_contract_test.c'
      - 'CHART-M1c-migration.md'
      - 'src/CHART_M1C_BUILD_NOTES.txt'
      - 'meson-chart-m1c.append'
      - 'meson-verified-series-contract.append'
      - 'docs/CHART01_ENERGY_INSTITUTE_AUDIT.md'
      - 'src/gistemp_admission.*'
      - 'src/gistemp_evidence.*'
      - 'src/gistemp_sra.*'
      - 'src/chart_render.*'
      - 'tests/chart_render_test.c'
      - 'src/chart_m4.*'
      - 'tests/chart_m4_test.c'
      - 'tests/chart_m4_cairo_test.c'
      - 'scripts/chart03_preview_log.py'
      - 'src/chart_projection.*'
      - 'src/chart_projection_internal.h'
      - 'tests/chart_projection_test.c'
      - 'src/chart_spec.*'
      - 'tests/chart_spec_test.c'
      - 'src/verified_series.*'
      - 'tests/verified_series_test.c'
      - 'src/scientific_result.*'
      - 'src/scientific_operation.*'
      - 'src/scientific_derivation.*'
      - 'tests/gistemp_sra_test.c'
      - 'src/scientific_artifact.*'
      - 'tests/gistemp_evidence_test.c'
      - 'tests/gistemp_admission_test.c'
      - 'src/scientific_canonical.*'
      - 'tests/annual_series_candidate_test.c'
      - 'tests/fixtures/chart01/**'
      - 'meson.build'
      - '.github/workflows/chart01-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libglib2.0-dev libjson-glib-dev libcairo2-dev libfontconfig-dev fonts-dejavu-core
      - name: Compile and test under ASan and UBSan
        env:
          ATM_CHART03_OUTPUT: /tmp/chart03-preview
          ATM_CHART01_FIXTURE: tests/fixtures/chart01
          ATM_CHART01_CSV: tests/fixtures/chart01/ewd/science/data/processed/nasa_gistemp_global_2026.csv
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/annual_series_candidate.c src/scientific_canonical.c \
            tests/annual_series_candidate_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/annual-series-candidate-test
          /tmp/annual-series-candidate-test
          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/gistemp_admission.c src/annual_series_candidate.c \
            src/scientific_canonical.c tests/gistemp_admission_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/gistemp-admission-test
          /tmp/gistemp-admission-test
          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/gistemp_evidence.c src/gistemp_admission.c \
            src/annual_series_candidate.c src/scientific_canonical.c \
            src/scientific_artifact.c tests/gistemp_evidence_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/gistemp-evidence-test
          /tmp/gistemp-evidence-test

          # Exercise the Energy Institute's source-specific tests directly, not
          # only through the generic descriptor-equivalence suite. In particular,
          # the evidence forgery test must cover accounting-method metadata.
          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/energy_institute_admission.c src/energy_institute_candidate.c \
            src/scientific_canonical.c tests/energy_institute_admission_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/energy-institute-admission-test
          /tmp/energy-institute-admission-test
          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/energy_institute_evidence.c src/energy_institute_admission.c \
            src/energy_institute_candidate.c src/scientific_canonical.c \
            src/scientific_artifact.c tests/energy_institute_evidence_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/energy-institute-evidence-test
          /tmp/energy-institute-evidence-test

          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/gistemp_sra.c src/gistemp_evidence.c src/gistemp_admission.c \
            src/annual_series_candidate.c src/scientific_canonical.c \
            src/scientific_artifact.c src/scientific_result.c \
            src/scientific_operation.c src/scientific_derivation.c \
            tests/gistemp_sra_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/gistemp-sra-test
          /tmp/gistemp-sra-test
          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            -DATM_VERIFIED_SERIES_TESTING \
            src/verified_series.c src/gistemp_sra.c src/gistemp_evidence.c \
            src/gistemp_admission.c src/annual_series_candidate.c \
            src/scientific_canonical.c src/scientific_artifact.c \
            src/scientific_result.c src/scientific_operation.c \
            src/scientific_derivation.c tests/verified_series_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/verified-series-test
          /tmp/verified-series-test
          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/chart_spec.c src/verified_series.c src/gistemp_sra.c src/gistemp_evidence.c \
            src/gistemp_admission.c src/annual_series_candidate.c \
            src/scientific_canonical.c src/scientific_artifact.c \
            src/scientific_result.c src/scientific_operation.c \
            src/scientific_derivation.c tests/chart_spec_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/chart-spec-test
          /tmp/chart-spec-test
          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/chart_projection.c src/chart_spec.c src/verified_series.c src/gistemp_sra.c src/gistemp_evidence.c \
            src/gistemp_admission.c src/annual_series_candidate.c \
            src/scientific_canonical.c src/scientific_artifact.c \
            src/scientific_result.c src/scientific_operation.c \
            src/scientific_derivation.c tests/chart_projection_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/chart-projection-test
          /tmp/chart-projection-test
          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/chart_m4.c tests/chart_m4_test.c \
            $(pkg-config --cflags --libs glib-2.0) -lm \
            -o /tmp/chart-m4-test
          /tmp/chart-m4-test
          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/chart_m4.c tests/chart_m4_cairo_test.c \
            $(pkg-config --cflags --libs glib-2.0 cairo) -lm \
            -o /tmp/chart-m4-cairo-test
          /tmp/chart-m4-cairo-test
          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/chart_render.c src/chart_projection.c src/chart_spec.c src/verified_series.c src/gistemp_sra.c src/gistemp_evidence.c \
            src/gistemp_admission.c src/annual_series_candidate.c \
            src/scientific_canonical.c src/scientific_artifact.c \
            src/scientific_result.c src/scientific_operation.c \
            src/scientific_derivation.c tests/chart_render_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0 cairo fontconfig) -lm \
            -o /tmp/chart-render-test
          /tmp/chart-render-test
          cc -std=c11 -Wall -Wextra -Werror -Isrc \
            $(pkg-config --cflags glib-2.0 json-glib-1.0) \
            -c src/verified_series.c -o /tmp/verified-series-production.o
          nm -g /tmp/verified-series-production.o | python3 -c \
            'import sys; assert "atm_verified_series_test_rehash" not in sys.stdin.read()'
          # CHART-M1c generic Evidence/SRA/adapter/bridge. These targets are
          # compiled explicitly under ASan+UBSan: the Flatpak job is not a
          # substitute for running the scientific native regression suites.
          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/series_evidence.c src/series_evidence_adapters.c \
            src/gistemp_evidence.c src/gistemp_admission.c \
            src/energy_institute_evidence.c src/energy_institute_admission.c \
            src/energy_institute_candidate.c src/annual_series_candidate.c \
            src/scientific_canonical.c src/scientific_artifact.c \
            tests/series_evidence_equivalence_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/series-evidence-equivalence-test
          /tmp/series-evidence-equivalence-test

          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/series_sra.c src/series_evidence.c src/series_evidence_adapters.c \
            src/gistemp_sra.c src/gistemp_evidence.c src/gistemp_admission.c \
            src/energy_institute_evidence.c src/energy_institute_admission.c \
            src/energy_institute_candidate.c src/annual_series_candidate.c \
            src/scientific_canonical.c src/scientific_artifact.c \
            src/scientific_result.c src/scientific_operation.c \
            src/scientific_derivation.c tests/series_sra_equivalence_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/series-sra-equivalence-test
          /tmp/series-sra-equivalence-test

          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/series_adapter.c src/series_sra.c src/series_evidence.c \
            src/series_evidence_adapters.c src/series_contract.c \
            src/gistemp_evidence.c src/gistemp_admission.c \
            src/energy_institute_evidence.c src/energy_institute_admission.c \
            src/energy_institute_candidate.c src/annual_series_candidate.c \
            src/scientific_canonical.c src/scientific_artifact.c \
            src/scientific_result.c src/scientific_operation.c \
            src/scientific_derivation.c tests/series_adapter_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/series-adapter-test
          /tmp/series-adapter-test

          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/verified_series_contract.c src/verified_series.c \
            src/gistemp_sra.c src/gistemp_evidence.c src/gistemp_admission.c \
            src/energy_institute_evidence.c src/energy_institute_admission.c \
            src/energy_institute_candidate.c src/annual_series_candidate.c \
            src/series_adapter.c src/series_sra.c src/series_evidence.c \
            src/series_evidence_adapters.c src/series_contract.c \
            src/scientific_canonical.c src/scientific_artifact.c \
            src/scientific_result.c src/scientific_operation.c \
            src/scientific_derivation.c tests/verified_series_contract_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/verified-series-contract-test
          /tmp/verified-series-contract-test

          cc -std=c11 -Wall -Wextra -Werror -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            src/series_contract.c src/scientific_canonical.c \
            src/scientific_artifact.c src/scientific_result.c \
            src/scientific_operation.c src/scientific_derivation.c \
            tests/series_contract_test.c \
            $(pkg-config --cflags --libs glib-2.0 json-glib-1.0) -lm \
            -o /tmp/series-contract-test
          /tmp/series-contract-test
      - name: Publish bounded headless preview diagnostics
        run: python3 scripts/chart03_preview_log.py /tmp/chart03-preview
      - uses: actions/upload-artifact@v4
        with:
          name: chart03-headless-preview
          path: /tmp/chart03-preview/
          if-no-files-found: error
