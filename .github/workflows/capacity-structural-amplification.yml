name: C0P-M6 structural capacity amplification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/capacity-v2/corpus.json'
      - 'scripts/generate_capacity_synthetic_repository.py'
      - 'src/archive_extract.c'
      - 'src/archive_extract.h'
      - 'src/capacity_measurement.c'
      - 'src/capacity_measurement.h'
      - 'src/cff_version.c'
      - 'src/cff_version.h'
      - 'src/repository_ingest.c'
      - 'src/repository_ingest.h'
      - 'src/repository_manifest.c'
      - 'src/repository_manifest.h'
      - 'src/repository_storage.c'
      - 'src/repository_storage.h'
      - 'src/repository_sources.c'
      - 'src/repository_sources.h'
      - 'src/markdown_sections.c'
      - 'src/markdown_sections.h'
      - 'src/csv_table.c'
      - 'src/csv_table.h'
      - 'src/structured_json.c'
      - 'src/structured_json.h'
      - 'src/retrieval_index.c'
      - 'src/retrieval_index.h'
      - 'data/schemas/retrieval-index-v2.sql'
      - 'data/io.github.laurentiustaicu.ask_the_model.gresource.xml'
      - 'tests/capacity_measurement_real_runner.c'
      - '.github/workflows/capacity-structural-amplification.yml'

permissions:
  contents: read

concurrency:
  group: capacity-c0p-m6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout AtM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install measurement dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            pkg-config \
            libarchive-dev \
            libglib2.0-dev \
            libglib2.0-bin \
            libjson-glib-dev \
            libsqlite3-dev \
            libyaml-dev

      - name: Compile real capacity measurement runner
        shell: bash
        run: |
          set -euo pipefail

          glib-compile-resources \
            data/io.github.laurentiustaicu.ask_the_model.gresource.xml \
            --sourcedir=data \
            --generate-source \
            --target=/tmp/atm-resources.c

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -Isrc \
            $(pkg-config --cflags \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0) \
            -c tests/capacity_measurement_real_runner.c \
            -o /tmp/capacity-measurement-real-runner.o

          cc \
            -std=c11 \
            -D_GNU_SOURCE \
            -O2 \
            -Wall \
            -Wextra \
            -Isrc \
            src/capacity_measurement.c \
            src/cff_version.c \
            src/archive_extract.c \
            src/repository_manifest.c \
            src/repository_storage.c \
            src/repository_ingest.c \
            src/repository_sources.c \
            src/markdown_sections.c \
            src/csv_table.c \
            src/structured_json.c \
            src/retrieval_index.c \
            /tmp/capacity-measurement-real-runner.o \
            /tmp/atm-resources.c \
            $(pkg-config --cflags --libs \
              glib-2.0 \
              gio-2.0 \
              json-glib-1.0 \
              sqlite3 \
              libarchive \
              yaml-0.1) \
            -o /tmp/atm-capacity-real-runner

      - name: Measure frozen M4 training corpus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          root=/tmp/atm-c0p-m6
          mkdir -p "$root/training" "$root/work"

          python3 - <<'PY' > "$root/training.tsv"
          import json
          import pathlib

          corpus = json.loads(
              pathlib.Path(
                  "benchmarks/capacity-v2/corpus.json"
              ).read_text(encoding="utf-8")
          )

          count = 0
          for repository in corpus["repositories"]:
              for sample in repository["samples"]:
                  print(
                      repository["repository_id"],
                      repository["repository"],
                      repository["acronym"],
                      repository["display_name"],
                      sample["label"],
                      sample["sha"],
                      sep="\t",
                  )
                  count += 1

          if count != 18:
              raise SystemExit(
                  f"M6 training must remain the 18-SHA M4 corpus, got {count}"
              )
          PY

          while IFS=$'\t' read -r \
            repository_id repository acronym display_name label snapshot_sha
          do
            work="$root/work/training/$repository_id/$label"
            archive_dir="$work/cache/repository-staging/$repository_id"
            archive="$archive_dir/$snapshot_sha.tar.gz"
            output="$root/training/$repository_id-$label.json"

            mkdir -p "$archive_dir" "$work/data" "$work/state"

            curl \
              --fail \
              --location \
              --retry 3 \
              --silent \
              --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/LaurentiuStaicu/$repository/tarball/$snapshot_sha" \
              --output "$archive"

            test -s "$archive"

            /tmp/atm-capacity-real-runner \
              "$ATM_SOURCE_COMMIT" \
              "$repository_id" \
              "$acronym" \
              "$display_name" \
              "$snapshot_sha" \
              "$archive" \
              "$work" \
              "$output"
          done < "$root/training.tsv"

      - name: Generate and measure synthetic structural scenarios
        shell: bash
        env:
          ATM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          root=/tmp/atm-c0p-m6
          mkdir -p "$root/synthetic"

          scenarios=(
            ewd-csv-50k
            ewd-csv-150k
            cbd-json-25k
            cbd-json-75k
            rmd-markdown-4m
            rmd-markdown-12m
          )

          for scenario in "${scenarios[@]}"; do
            case "$scenario" in
              ewd-*)
                repository_id=ewd
                acronym=EWD
                display_name="Empirical World3 Dynamics"
                ;;
              cbd-*)
                repository_id=cbd
                acronym=CBD
                display_name="Cognitive Belief Dynamics"
                ;;
              rmd-*)
                repository_id=rmd
                acronym=RMD
                display_name="Romanian Monetary Dynamics"
                ;;
              *)
                echo "Unknown synthetic scenario: $scenario" >&2
                exit 1
                ;;
            esac

            fixture="$root/fixture-$scenario"
            python3 scripts/generate_capacity_synthetic_repository.py \
              --scenario "$scenario" \
              --output "$fixture"

            snapshot_id="$(
              printf '%s' "$scenario" |
              sha1sum |
              awk '{print $1}'
            )"

            archive="$root/$scenario.tar.gz"
            tar \
              -czf "$archive" \
              -C "$root" \
              "fixture-$scenario"

            work="$root/work/synthetic/$scenario"
            archive_dir="$work/cache/repository-staging/$repository_id"
            staged_archive="$archive_dir/$snapshot_id.tar.gz"
            mkdir -p "$archive_dir" "$work/data" "$work/state"
            cp "$archive" "$staged_archive"

            output="$root/synthetic/$scenario.json"

            /tmp/atm-capacity-real-runner \
              "$ATM_SOURCE_COMMIT" \
              "$repository_id" \
              "$acronym" \
              "$display_name" \
              "$snapshot_id" \
              "$staged_archive" \
              "$work" \
              "$output"

            python3 -m json.tool "$output" >/dev/null
          done

      - name: Fit historical hybrid and evaluate structural stress
        shell: bash
        env:
          ATM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ATM_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import platform
          from fractions import Fraction

          root = pathlib.Path("/tmp/atm-c0p-m6")

          def load(directory):
              return [
                  json.loads(path.read_text(encoding="utf-8"))
                  for path in sorted(directory.glob("*.json"))
              ]

          training_records = load(root / "training")
          synthetic_records = load(root / "synthetic")

          if len(training_records) != 18:
              raise SystemExit(
                  f"expected 18 training records, got {len(training_records)}"
              )
          if len(synthetic_records) != 6:
              raise SystemExit(
                  f"expected 6 synthetic records, got {len(synthetic_records)}"
              )

          def row(record):
              logical = record["snapshot"]["logical_regular_bytes"]
              entries = record["snapshot"]["entries"]
              snapshot_peak = record["ingest_report"][
                  "fresh_data_root_additional_peak_bytes"
              ]
              index_peak = record["index_build"][
                  "cache_root_additional_peak_bytes"
              ]

              if logical <= 0 or entries <= 0:
                  raise SystemExit("non-positive structural observable")

              overhead = max(0, snapshot_peak - logical)

              return {
                  "repository_id": record["repository_id"],
                  "repository_sha": record["repository_sha"],
                  "logical": logical,
                  "entries": entries,
                  "snapshot": snapshot_peak,
                  "index": index_peak,
                  "snapshot_overhead_per_entry":
                      Fraction(overhead, entries),
                  "snapshot_ratio":
                      Fraction(snapshot_peak, logical),
                  "index_ratio":
                      Fraction(index_peak, logical),
                  "index_per_entry":
                      Fraction(index_peak, entries),
              }

          training = [row(record) for record in training_records]
          synthetic = [row(record) for record in synthetic_records]

          def ceil_fraction(value):
              return (
                  value.numerator +
                  value.denominator - 1
              ) // value.denominator

          fitted = {}
          evaluations = {}
          summary = {}

          for rid in ("ewd", "cbd", "rmd"):
              train = [item for item in training if item["repository_id"] == rid]
              test = [item for item in synthetic if item["repository_id"] == rid]

              if len(train) != 6 or len(test) != 2:
                  raise SystemExit(
                      f"{rid}: expected 6 training + 2 structural cases"
                  )

              snapshot_overhead = max(
                  item["snapshot_overhead_per_entry"]
                  for item in train
              )
              snapshot_ratio = max(
                  item["snapshot_ratio"]
                  for item in train
              )
              snapshot_floor = max(item["snapshot"] for item in train)
              index_ratio = max(item["index_ratio"] for item in train)
              index_per_entry = max(
                  item["index_per_entry"]
                  for item in train
              )
              index_floor = max(item["index"] for item in train)

              fitted[rid] = {
                  "snapshot_floor": snapshot_floor,
                  "index_floor": index_floor,
              }

              cases = []
              for item in test:
                  snap_additive = (
                      item["logical"] +
                      ceil_fraction(
                          snapshot_overhead * item["entries"]
                      )
                  )
                  snap_ratio = ceil_fraction(
                      snapshot_ratio * item["logical"]
                  )
                  snap_prediction = max(
                      snap_additive,
                      snap_ratio,
                      snapshot_floor,
                  )

                  idx_ratio = ceil_fraction(
                      index_ratio * item["logical"]
                  )
                  idx_entry = ceil_fraction(
                      index_per_entry * item["entries"]
                  )
                  idx_prediction = max(
                      idx_ratio,
                      idx_entry,
                      index_floor,
                  )

                  cases.append({
                      "synthetic_snapshot_id": item["repository_sha"],
                      "logical_regular_bytes": item["logical"],
                      "entries": item["entries"],
                      "snapshot": {
                          "predicted_bytes": snap_prediction,
                          "actual_bytes": item["snapshot"],
                          "covered": snap_prediction >= item["snapshot"],
                          "actual_over_prediction":
                              item["snapshot"] / max(snap_prediction, 1),
                      },
                      "index": {
                          "predicted_bytes": idx_prediction,
                          "actual_bytes": item["index"],
                          "covered": idx_prediction >= item["index"],
                          "actual_over_prediction":
                              item["index"] / max(idx_prediction, 1),
                      },
                  })

              evaluations[rid] = cases
              summary[rid] = {
                  "snapshot_covered": sum(
                      1 for case in cases
                      if case["snapshot"]["covered"]
                  ),
                  "index_covered": sum(
                      1 for case in cases
                      if case["index"]["covered"]
                  ),
                  "case_count": len(cases),
                  "snapshot_worst_actual_over_prediction": max(
                      case["snapshot"]["actual_over_prediction"]
                      for case in cases
                  ),
                  "index_worst_actual_over_prediction": max(
                      case["index"]["actual_over_prediction"]
                      for case in cases
                  ),
              }

          artifact = {
              "schema_version": 1,
              "measurement_id":
                  "atm-c0p-m6-structural-amplification-v1",
              "production_prediction_selected": False,
              "production_margin_selected": False,
              "synthetic_stress_only": True,
              "atm_source_commit": os.environ["ATM_SOURCE_COMMIT"],
              "workflow_commit": os.environ["ATM_WORKFLOW_COMMIT"],
              "runtime": {
                  "system": platform.system(),
                  "release": platform.release(),
                  "machine": platform.machine(),
              },
              "scenario_contract": {
                  "ewd": [
                      "ewd-csv-50k",
                      "ewd-csv-150k",
                  ],
                  "cbd": [
                      "cbd-json-25k",
                      "cbd-json-75k",
                  ],
                  "rmd": [
                      "rmd-markdown-4m",
                      "rmd-markdown-12m",
                  ],
              },
              "fitted_on_m4_training_only": fitted,
              "evaluations": evaluations,
              "summary": summary,
              "interpretation": [
                  "Synthetic scenarios are valid AtM repository contracts but are not scientific repository commits.",
                  "They stress content-type/cardinality patterns within current parser limits.",
                  "The M4/M5 hybrid is fitted only on the real 18-SHA M4 training corpus.",
                  "Underprediction is retained and no automatic margin is added.",
                  "This measurement does not select production policy.",
              ],
          }

          output = root / "c0p-m6-structural-amplification.json"
          output.write_text(
              json.dumps(
                  artifact,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload C0P-M6 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atm-c0p-m6-structural-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/atm-c0p-m6/training/*.json
            /tmp/atm-c0p-m6/synthetic/*.json
            /tmp/atm-c0p-m6/c0p-m6-structural-amplification.json
          if-no-files-found: error
          retention-days: 90
