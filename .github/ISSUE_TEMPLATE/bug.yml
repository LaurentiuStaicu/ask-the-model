name: Bug / application problem
description: Report a reproducible AtM application, build, Flatpak, UI, or chat problem.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: AtM version
      placeholder: "v0.3.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - GitHub release Flatpak bundle
        - Development Flatpak repository
        - Local/source build
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "elementary OS 8 / GNOME / other Linux environment"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the troubleshooting documentation.
          required: true
        - label: This issue does not contain sensitive vulnerability details.
          required: true
