<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Ask the Model v0.3 interface map</title>
  <desc id="desc">Annotated vector overview of the Ask the Model application showing model and repository controls, status display, chat tabs, transcript, prompt composer and source detail window.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
    <style>
      .callout { fill:#ffffff; stroke:#707070; stroke-width:2; rx:14; }
      .n { fill:#333333; }
      .label { font:600 22px sans-serif; fill:#111111; }
      .small { font:400 16px sans-serif; fill:#333333; }
      .ui { font:500 18px sans-serif; fill:#f3f3f3; }
      .ui2 { font:400 15px monospace; fill:#dedede; }
      .muted { fill:#a0a0a0; }
      .arrow { stroke:#333333; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="130" cy="120" r="170" fill="#ffffff" opacity="0.45"/>
  <circle cx="1490" cy="850" r="260" fill="#a0a0a0" opacity="0.18"/>

  <!-- Main application -->
  <g filter="url(#shadow)">
    <rect x="315" y="155" width="970" height="650" rx="18" fill="#181818" stroke="#333333" stroke-width="3"/>
    <rect x="315" y="155" width="970" height="58" rx="18" fill="#333333"/>
    <rect x="315" y="195" width="970" height="18" fill="#333333"/>
    <text x="800" y="191" text-anchor="middle" class="ui">Ask the Model</text>

    <!-- Header controls -->
    <rect x="342" y="169" width="180" height="32" rx="6" fill="#242424" stroke="#707070"/>
    <text x="354" y="191" class="ui2">computer-board:latest ▾</text>
    <rect x="530" y="169" width="36" height="32" rx="6" fill="#242424" stroke="#707070"/>
    <text x="548" y="191" text-anchor="middle" class="ui">↻</text>

    <rect x="590" y="169" width="220" height="32" rx="6" fill="#242424" stroke="#707070"/>
    <text x="604" y="191" class="ui2">EWD + CBD + RMD ▾</text>
    <rect x="818" y="169" width="36" height="32" rx="6" fill="#242424" stroke="#707070"/>
    <text x="836" y="191" text-anchor="middle" class="ui">↻</text>
    <rect x="862" y="169" width="36" height="32" rx="6" fill="#242424" stroke="#707070"/>
    <text x="880" y="191" text-anchor="middle" class="ui">⇩</text>

    <!-- LCD -->
    <rect x="315" y="213" width="970" height="34" fill="#121212" stroke="#707070"/>
    <text x="803" y="235" text-anchor="middle" class="ui2">
      EWD   CBD   RMD       READY       OFFLINE       ERR
    </text>

    <!-- Tabs -->
    <rect x="315" y="247" width="970" height="52" fill="#1d1d1d"/>
    <rect x="332" y="258" width="42" height="31" rx="4" fill="#242424" stroke="#707070"/>
    <text x="353" y="280" text-anchor="middle" class="ui">+</text>
    <rect x="383" y="258" width="210" height="31" rx="4" fill="#2a2a2a" stroke="#707070"/>
    <text x="398" y="279" class="ui2">Definiții EWD CBD</text>
    <text x="576" y="279" class="ui2">×</text>

    <!-- Transcript -->
    <rect x="338" y="313" width="924" height="330" rx="8" fill="#171717"/>
    <text x="356" y="345" class="ui2">You: Ce reprezintă EWD, CBD și RMD?</text>
    <text x="356" y="382" class="ui2">Assistant: Empirical World3 Dynamics (EWD) este...</text>
    <text x="356" y="414" class="ui2">Cognitive Belief Dynamics (CBD) reprezintă...</text>
    <text x="356" y="446" class="ui2">Romanian Monetary Dynamics (RMD) este...</text>
    <text x="356" y="493" class="ui2">Sources:  [1]  [2]  [3]  [4]  [5]  [6]</text>

    <!-- Composer -->
    <rect x="338" y="662" width="805" height="118" rx="12" fill="#303030" stroke="#a0a0a0"/>
    <text x="358" y="696" class="ui2">Ask something…</text>
    <rect x="1157" y="719" width="86" height="44" rx="7" fill="#242424" stroke="#707070"/>
    <text x="1200" y="747" text-anchor="middle" class="ui2">Send</text>
  </g>

  <!-- Source detail window -->
  <g filter="url(#shadow)">
    <rect x="1110" y="370" width="400" height="330" rx="14" fill="#333333" stroke="#707070" stroke-width="2"/>
    <rect x="1110" y="370" width="400" height="44" rx="14" fill="#2a2a2a"/>
    <text x="1310" y="399" text-anchor="middle" class="ui">Source [1]</text>
    <text x="1132" y="446" class="ui2">EWD · v0.1.0</text>
    <text x="1132" y="474" class="ui2">README.md · lines:1-18</text>
    <text x="1132" y="502" class="ui2">Snapshot: 795a6b8e…</text>
    <text x="1132" y="530" class="ui2">Source ID: ewd:section:README…</text>
    <text x="1132" y="570" class="ui2">Readable excerpt from the</text>
    <text x="1132" y="594" class="ui2">immutable repository snapshot.</text>
    <text x="1132" y="648" font-family="sans-serif" font-size="16" fill="#f2f2f2" text-decoration="underline">Open immutable source</text>
  </g>

  <!-- Callout 1 -->
  <g>
    <rect class="callout" x="55" y="130" width="225" height="100"/>
    <circle class="n" cx="88" cy="163" r="20"/><text x="88" y="171" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">1</text>
    <text class="label" x="120" y="166">AI model</text>
    <text class="small" x="76" y="198">Choose the local provider model.</text>
    <path class="arrow" d="M280 180 C315 180, 320 182, 342 185"/>
  </g>

  <!-- Callout 2 -->
  <g>
    <rect class="callout" x="55" y="255" width="225" height="100"/>
    <circle class="n" cx="88" cy="288" r="20"/><text x="88" y="296" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">2</text>
    <text class="label" x="120" y="291">Model refresh</text>
    <text class="small" x="76" y="323">Re-scan provider-managed models.</text>
    <path class="arrow" d="M280 305 C350 295, 450 240, 548 198"/>
  </g>

  <!-- Callout 3 -->
  <g>
    <rect class="callout" x="55" y="380" width="225" height="118"/>
    <circle class="n" cx="88" cy="413" r="20"/><text x="88" y="421" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">3</text>
    <text class="label" x="120" y="416">Repository scope</text>
    <text class="small" x="76" y="447">Select EWD, CBD and RMD before</text>
    <text class="small" x="76" y="470">the first Send.</text>
    <path class="arrow" d="M280 435 C370 360, 470 260, 650 198"/>
  </g>

  <!-- Callout 4 -->
  <g>
    <rect class="callout" x="55" y="525" width="225" height="118"/>
    <circle class="n" cx="88" cy="558" r="20"/><text x="88" y="566" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">4</text>
    <text class="label" x="120" y="561">Refresh / Update</text>
    <text class="small" x="76" y="592">Check remote SHA, then download</text>
    <text class="small" x="76" y="615">or update validated snapshots.</text>
    <path class="arrow" d="M280 575 C460 470, 690 300, 860 200"/>
  </g>

  <!-- Callout 5 -->
  <g>
    <rect class="callout" x="55" y="670" width="225" height="118"/>
    <circle class="n" cx="88" cy="703" r="20"/><text x="88" y="711" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">5</text>
    <text class="label" x="120" y="706">Status LCD</text>
    <text class="small" x="76" y="737">Compact lifecycle state for model</text>
    <text class="small" x="76" y="760">and repository operations.</text>
    <path class="arrow" d="M280 720 C430 590, 520 360, 610 235"/>
  </g>

  <!-- Callout 6 -->
  <g>
    <rect class="callout" x="1305" y="110" width="235" height="118"/>
    <circle class="n" cx="1338" cy="143" r="20"/><text x="1338" y="151" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">6</text>
    <text class="label" x="1370" y="146">Chat tabs</text>
    <text class="small" x="1326" y="177">Independent model/repository identity</text>
    <text class="small" x="1326" y="200">and in-memory conversation state.</text>
    <path class="arrow" d="M1305 190 C1210 220, 1080 255, 590 273"/>
  </g>

  <!-- Callout 7 -->
  <g>
    <rect class="callout" x="1305" y="245" width="235" height="110"/>
    <circle class="n" cx="1338" cy="278" r="20"/><text x="1338" y="286" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">7</text>
    <text class="label" x="1370" y="281">Grounded answer</text>
    <text class="small" x="1326" y="312">Retrieved evidence stays turn-local;</text>
    <text class="small" x="1326" y="335">numbered sources remain inspectable.</text>
    <path class="arrow" d="M1305 315 C1225 330, 1130 365, 860 430"/>
  </g>

  <!-- Callout 8 -->
  <g>
    <rect class="callout" x="1305" y="730" width="235" height="110"/>
    <circle class="n" cx="1338" cy="763" r="20"/><text x="1338" y="771" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">8</text>
    <text class="label" x="1370" y="766">Prompt composer</text>
    <text class="small" x="1326" y="797">Write the next turn; Send freezes</text>
    <text class="small" x="1326" y="820">model/repository identity on turn 1.</text>
    <path class="arrow" d="M1305 780 C1240 770, 1190 740, 1100 720"/>
  </g>

  <!-- Callout 9 -->
  <g>
    <rect class="callout" x="970" y="835" width="300" height="105"/>
    <circle class="n" cx="1005" cy="868" r="20"/><text x="1005" y="876" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">9</text>
    <text class="label" x="1038" y="871">Source detail window</text>
    <text class="small" x="992" y="902">Exact repository/version/SHA, locator,</text>
    <text class="small" x="992" y="925">readable excerpt and immutable link.</text>
    <path class="arrow" d="M1170 835 C1220 790, 1290 730, 1320 700"/>
  </g>

  <text x="55" y="930" font-family="sans-serif" font-size="18" fill="#707070">Ask the Model · v0.3 interface map · vector reconstruction, not a screenshot</text>
</svg>